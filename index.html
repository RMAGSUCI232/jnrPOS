  const rows = customerExportRows();
  const ws = XLSX.utils.json_to_sheet(rows);
  ws['!cols'] = [{wch:22},{wch:16},{wch:16},{wch:24},{wch:24},{wch:14},{wch:16},{wch:30},{wch:12}];
  const wb = XLSX.utils.book_new();
  XLSX.utils.book_append_sheet(wb, ws, 'Customers');
  XLSX.writeFile(wb, `customers-${todayStr()}.xlsx`);
  toast('Customer list exported to Excel.','ok');
}

function exportCustomersPDF(){
  if(typeof window.jspdf === 'undefined'){ toast('PDF export library did not load — check your internet connection.','err'); return; }
  const { jsPDF } = window.jspdf;
  const doc = new jsPDF({ orientation:'landscape' });
  doc.setFontSize(14);

  doc.text(`Customer List — generated ${new Date().toLocaleString('en-PH')}`, 14, 22);
  const rows = customerExportRows();
  doc.autoTable({
    startY: 28,
    head: [['Name','Barcode','Phone','Email','Address','Lifetime Sales','Lay-away Balance','Notes']],
    body: rows.map(r=>[r.Name, r.Barcode, r.Phone, r.Email, r.Address, fmt(r['Lifetime Sales']), fmt(r['Lay-away Balance']), r.Notes]),
    styles:{ fontSize:8 },
    headStyles:{ fillColor:[20,85,90] }
  });

  toast('Customer list exported to PDF.','ok');
}

function bindLayawayEvents(){
  document.querySelectorAll('[data-action="lay-payment"]').forEach(b=>b.addEventListener('click',()=>openLayawayPaymentModal(b.dataset.id)));
  document.querySelectorAll('[data-action="lay-view"]').forEach(b=>b.addEventListener('click',()=>openLayawayViewModal(b.dataset.id)));
  document.querySelectorAll('[data-action="lay-cancel"]').forEach(b=>b.addEventListener('click',()=>{
    const l = state.layaways.find(x=>x.id===b.dataset.id);
    if(!l) return;
    if(confirm('Cancel this lay-away order? Items will be returned to stock.')){
      l.items.forEach(it=>{ const p=getProd(it.productId); if(p && !p.nonInventory) p.stock += it.qty; });
      l.status='cancelled';
      save(); renderView(); toast('Lay-away cancelled, stock restored.','ok');
    }
  }));
}

function openLayawayPaymentModal(id){
  const l = state.layaways.find(x=>x.id===id);
  openModal('Add Payment — ' + l.receiptNo, `
    <div class="hint" style="margin-bottom:10px;">Balance due: <strong>${fmt(l.balance)}</strong></div>
    <div class="field"><label>Payment amount</label><input id="m-amt" type="number" min="0" step="0.01" value=""></div>
    <div class="field"><label>Payment method</label>
      <select id="m-method"><option value="cash">Cash</option><option value="gcash">GCash</option></select>
    </div>
    <div class="field" id="m-ref-field" style="display:none;"><label>GCash reference number</label><input id="m-ref" placeholder="e.g. 0123456789012"></div>
  `, `<button class="btn btn-ghost" data-action="close-modal">Cancel</button><button class="btn btn-primary" id="m-save">Record Payment</button>`);
  const methodSel = document.getElementById('m-method');
  const refField = document.getElementById('m-ref-field');
  methodSel.addEventListener('change', ()=>{ refField.style.display = methodSel.value==='gcash' ? 'block':'none'; });
  document.getElementById('m-save').addEventListener('click', ()=>{
    const amt = Number(document.getElementById('m-amt').value)||0;
    const method = document.getElementById('m-method').value;
    const gcashRef = method==='gcash' ? document.getElementById('m-ref').value.trim() : '';
    if(amt<=0){ toast('Enter a valid amount.','err'); return; }
    if(amt>l.balance){ toast('Amount exceeds remaining balance.','err'); return; }
    if(method==='gcash' && !gcashRef){ toast('Enter the GCash reference number.','err'); return; }
    l.payments.push({date:Date.now(), amount:amt, method, gcashRef});
    l.balance = round2(l.balance-amt);
    if(l.balance<=0){ l.status='completed'; l.completedAt=Date.now(); }
    save(); closeModal(); renderView(); toast('Payment recorded.','ok');
  });
}

============================================================ */
function collectGcashTransactions(){
  const out = [];
  state.sales.filter(s=>s.paymentMethod==='gcash').forEach(s=>{
    out.push({
      date: s.date, type:'Sale', receiptNo: s.receiptNo, customerId: s.customerId,
      reference: s.gcashRef, amount: s.total, voided: s.voided, saleId: s.id
    });
  });
  (state.gcashManual||[]).forEach(m=>{
    out.push({
      date: m.date, type: m.type || m.tag || 'Store Purchase', receiptNo: m.receiptNo, customerId: m.customerId,
      reference: m.reference, amount: m.amount, serviceFee: m.serviceFee||0, feeIncluded: m.feeIncluded||false, voided:false, manualId: m.id, note: m.note, processedBy: m.processedBy
    });
  });
  return out.sort((a,b)=>b.date-a.date);
}

function gcashTypeBadgeClass(type){
  if(type==='Cash-In' || type==='Sale') return 'badge-green';
  if(type==='Load') return 'badge-teal';
  if(type==='Cash-Out') return 'badge-amber';
  if(type==='Store Purchase') return 'badge-blue';
  return 'badge-grey';
}

function nextGcashManualNo(){ return nextReceiptNo(); }

function toDatetimeLocalValue(ts){
  const d = new Date(ts);
  const pad = n=>String(n).padStart(2,'0');
  return `${d.getFullYear()}-${pad(d.getMonth()+1)}-${pad(d.getDate())}T${pad(d.getHours())}:${pad(d.getMinutes())}`;
}

function viewGcash(){
  const from = state.ui.gcashFilterFrom||'', to = state.ui.gcashFilterTo||'';
  let list = collectGcashTransactions();
  if(from) list = list.filter(t=> localDateStr(t.date) >= from);
  if(to) list = list.filter(t=> localDateStr(t.date) <= to);

  const totalFees = list.filter(t=>!t.voided).reduce((a,t)=>a+(t.serviceFee||0),0);
  const daySummary = state.session.dayOpen ? computeDaySummary() : null;
  const gcashCashOnHand = daySummary ? daySummary.expectedGcashCash : null;
  const gcashWalletBalance = daySummary ? daySummary.gcashWalletBalance : null;

  const rows = list.length? list.map(t=>{
    const cust = t.customerId? getCust(t.customerId) : null;
    let actionsHtml = '';
    if(t.saleId) actionsHtml = `<button class="icon-btn" data-action="gcash-reprint" data-id="${t.saleId}">Reprint</button>`;
    else if(t.manualId) actionsHtml = `<button class="icon-btn" data-action="gcash-reprint-manual" data-id="${t.manualId}">Reprint</button><button class="icon-btn" data-action="gcash-delete-manual" data-id="${t.manualId}">Delete</button>`;
    return `<tr>
      <td>${new Date(t.date).toLocaleString('en-PH')}</td>
      <td><span class="badge ${gcashTypeBadgeClass(t.type)}">${esc(t.type)}</span></td>
      <td>${t.receiptNo}</td>
      <td>${cust? esc(cust.name) : (t.saleId? 'Walk-in' : '—')}</td>
      <td>${esc(t.processedBy||'—')}</td>
      <td class="mono">${esc(t.reference||'—')}</td>
      <td class="num">${fmt(t.amount)}</td>
      <td class="num">${t.serviceFee? fmt(t.serviceFee) : '—'}</td>
      <td>${t.serviceFee ? (t.feeIncluded? '<span class="badge badge-amber">Included</span>' : '<span class="badge badge-blue">Separate</span>') : '—'}</td>
      <td>${t.voided? '<span class="badge badge-red">Voided</span>' : '<span class="badge badge-green">Confirmed</span>'}</td>
      <td>${actionsHtml}</td>
    </tr>`;
  }).join('') : `<tr class="empty-row"><td colspan="11">No GCash transactions match these filters.</td></tr>`;

  return `
  <div class="view-title"><h1>GCash Sales</h1><div class="sub">GCash agent Cash-In / Load / Cash-Out ledger</div></div>
  <div class="stat-cards">
    <div class="stat-card"><div class="lbl">GCash Cash on Hand</div><div class="val">${gcashCashOnHand!=null? fmt(gcashCashOnHand) : '—'}</div>${!state.session.dayOpen? '<div class="hint" style="margin-top:4px;">Open the day to track this</div>':''}</div>
    <div class="stat-card"><div class="lbl">GCash Balance</div><div class="val">${gcashWalletBalance!=null? fmt(gcashWalletBalance) : '—'}</div>${!state.session.dayOpen? '<div class="hint" style="margin-top:4px;">Open the day to track this</div>':''}</div>
    <div class="stat-card"><div class="lbl">Service fees earned</div><div class="val">${fmt(totalFees)}</div></div>
  </div>

  <div class="card card-pad" style="margin-bottom:18px;">
    <h3 style="margin-top:0;">New GCash Transaction</h3>
    <div class="field-row">
      <div class="field"><label>Date/Time</label><input type="datetime-local" id="gtx-datetime" value="${toDatetimeLocalValue(Date.now())}"></div>
      <div class="field"></div>
    </div>
    <div class="field">
      <label>Transaction type</label>
      <div class="gtx-type-grid">
        <button type="button" class="gtx-type-tile checked" id="gtx-opt-in" data-value="cash-in">IN</button>
        <button type="button" class="gtx-type-tile" id="gtx-opt-out" data-value="cash-out">OUT</button>
        <button type="button" class="gtx-type-tile" id="gtx-opt-load" data-value="load">LOAD</button>
      </div>
      <input type="hidden" id="gtx-type-value" value="cash-in">
      <div class="hint">LOAD works the same as IN: the customer pays cash and you send it out from your GCash wallet.</div>
    </div>
    <div class="field">
      <label>Amount</label>
      <input type="text" inputmode="decimal" id="gtx-amount" placeholder="Tap to enter" autocomplete="off" readonly style="font-size:20px;text-align:right;font-family:'IBM Plex Mono',monospace;cursor:pointer;">
    </div>
    <div class="field">

function renderIdentifyField(innerId, hiddenId){
  const inner = document.getElementById(innerId);
  const hidden = document.getElementById(hiddenId);
  if(!inner || !hidden) return;

  if(hidden.value){
    inner.innerHTML = `
      <div class="cust-chip">
        <div><div class="name">${esc(hidden.value)}</div></div>
        <button type="button" class="icon-btn" data-action="identify-change">Change</button>
      </div>
    `;
    inner.querySelector('[data-action="identify-change"]').addEventListener('click', ()=>{
      hidden.value = '';
      hidden.dataset.userId = '';
      renderIdentifyField(innerId, hiddenId);
    });
  } else {
    inner.innerHTML = `<input type="password" class="identify-scan" placeholder="Scan ID barcode, or type passcode" autocomplete="off">`;
    const scanInp = inner.querySelector('.identify-scan');
    scanInp.addEventListener('keydown', (e)=>{
      if(e.key!=='Enter') return;
      e.preventDefault();
      const val = scanInp.value.trim();
      if(!val) return;
      let user = (state.users||[]).find(u=> u.barcode && u.barcode===val);
      if(!user) user = (state.users||[]).find(u=> u.passcode===val);
      if(!user){ toast('Not recognized. Scan again or check the passcode.','err'); scanInp.value=''; return; }
      hidden.value = user.name;
      hidden.dataset.userId = user.id;
      renderIdentifyField(innerId, hiddenId);
    });
    scanInp.focus();
  }
}

function bindGcashEvents(){
  const from = document.getElementById('gc-from'); if(from) from.addEventListener('change', ()=>{ state.ui.gcashFilterFrom = from.value; renderView(); });
  const to = document.getElementById('gc-to'); if(to) to.addEventListener('change', ()=>{ state.ui.gcashFilterTo = to.value; renderView(); });

  const gtxAmountInp = document.getElementById('gtx-amount');
  const gtxFeeInp = document.getElementById('gtx-fee');
  const feeIncludedHidden = document.getElementById('gtx-fee-included');

  const applyFeeLockState = ()=>{
    if(feeIncludedHidden.checked){
      gtxFeeInp.disabled = true;
      gtxFeeInp.style.opacity = '.55';
      gtxFeeInp.style.cursor = 'not-allowed';
    } else {
      gtxFeeInp.disabled = false;
      gtxFeeInp.style.opacity = '';
      gtxFeeInp.style.cursor = 'pointer';
    }
    document.getElementById('gtx-fee-included-hint').textContent = feeIncludedHidden.checked
      ? 'Deducted from the amount above — auto-filled from the fee schedule.'
      : 'Charged on top of the amount.';
  };
  applyFeeLockState();

  const refreshGtxFee = ()=>{
    const amt = Number(gtxAmountInp.value)||0;
    const fee = lookupGcashFee(amt);
    if(fee!==null) gtxFeeInp.value = fee;
  };

  if(gtxAmountInp) gtxAmountInp.addEventListener('click', ()=>{
    const extraHtml = `
      <div class="field" style="margin-top:14px;margin-bottom:0;">
        <label class="radio-opt" style="display:flex;width:100%;">
          <input type="checkbox" id="kp-fee-included" style="width:auto;" ${feeIncludedHidden.checked?'checked':''}>
          <span style="margin-left:8px;">Fee is deducted from the amount above (not charged separately)</span>
        </label>
        <div class="hint">Leave unchecked if the fee is charged on top of the amount (the usual case). When checked, the Service fee field auto-fills from your fee schedule and locks — since the fee and amount depend on each other in this mode.</div>
      </div>
    `;
    openNumericKeypadModal('Amount', gtxAmountInp.value, (val)=>{
      gtxAmountInp.value = val;
      const kpCheckbox = document.getElementById('kp-fee-included');
      feeIncludedHidden.checked = kpCheckbox ? kpCheckbox.checked : false;
      if(feeIncludedHidden.checked) refreshGtxFee();
      applyFeeLockState();
    }, extraHtml);
  });
  if(gtxFeeInp) gtxFeeInp.addEventListener('click', ()=>{
    if(gtxFeeInp.disabled) return;
    openNumericKeypadModal('Service fee', gtxFeeInp.value, (val)=>{ gtxFeeInp.value = val; });
  });

  document.querySelectorAll('[data-action="gcash-reprint"]').forEach(b=>b.addEventListener('click', ()=>{
    const s = state.sales.find(x=>x.id===b.dataset.id); if(s) printReceipt({type:'sale', record:s});
  }));
  document.querySelectorAll('[data-action="gcash-reprint-manual"]').forEach(b=>b.addEventListener('click', ()=>{
    const m = (state.gcashManual||[]).find(x=>x.id===b.dataset.id); if(m) showGcashReceiptPreview(m);
  }));
  document.querySelectorAll('[data-action="gcash-delete-manual"]').forEach(b=>b.addEventListener('click', ()=>{
    if(confirm('Delete this GCash transaction record? This only removes the log entry, not any sale.')){
      state.gcashManual = state.gcashManual.filter(m=>m.id!==b.dataset.id);
      save(); renderView(); toast('GCash transaction deleted.','ok');
    }
  }));

  document.querySelectorAll('.gtx-type-tile').forEach(tile=>{
    tile.addEventListener('click', ()=>{
      document.querySelectorAll('.gtx-type-tile').forEach(t=> t.classList.toggle('checked', t===tile));
      document.getElementById('gtx-type-value').value = tile.dataset.value;
    });
  });

  const recordBtn = document.querySelector('[data-action="record-gtx"]');
  if(recordBtn) recordBtn.addEventListener('click', ()=>{
    if(!validateGcashTransactionForm()) return;
    requireAuth('GCash Transaction', (user)=> recordGcashTransaction(user));
  });

  document.querySelectorAll('[data-action="delete-cash-adjust"]').forEach(btn=>{
    btn.addEventListener('click', ()=>{
      if(confirm('Delete this cash adjustment entry?')){
        state.cashAdjustments = (state.cashAdjustments||[]).filter(a=>a.id!==btn.dataset.id);
        save(); renderView(); toast('Adjustment deleted.','ok');
      }
    });
  });
}

function validateGcashTransactionForm(){
  const dtStr = document.getElementById('gtx-datetime').value;
  const amt = Number(document.getElementById('gtx-amount').value)||0;
  const feeStr = document.getElementById('gtx-fee').value.trim();
  const fee = Number(feeStr)||0;
  const typeVal = document.getElementById('gtx-type-value').value;

  if(!dtStr){ toast('Set the date and time.','err'); return null; }
  const ts = new Date(dtStr).getTime();
  if(isNaN(ts)){ toast('That date/time is not valid.','err'); return null; }
  if(amt<=0){ toast('Enter a valid amount.','err'); return null; }
  if(feeStr===''){ toast('Enter the service fee (enter 0 if none was charged).','err'); return null; }
  if(fee<0){ toast('Service fee cannot be negative.','err'); return null; }
  if(!typeVal){ toast('Choose IN, OUT, or LOAD.','err'); return null; }
  return true;
}

function recordGcashTransaction(user){
  const dtStr = document.getElementById('gtx-datetime').value;
  const amt = Number(document.getElementById('gtx-amount').value)||0;
  const feeStr = document.getElementById('gtx-fee').value.trim();
  const fee = Number(feeStr)||0;
  const typeVal = document.getElementById('gtx-type-value').value;
  const ref = document.getElementById('gtx-ref').value.trim();
  const note = document.getElementById('gtx-note').value.trim();
  const ts = new Date(dtStr).getTime();

  const entry = {
    id: uid('gcm'), date: ts, receiptNo: nextGcashManualNo(),
    type: typeVal==='cash-in' ? 'Cash-In' : typeVal==='load' ? 'Load' : 'Cash-Out',
    amount: amt, serviceFee: fee, feeIncluded: document.getElementById('gtx-fee-included').checked,
    processedBy: user? user.name : '', note, reference: ref, customerId: null
  };
  if(!state.gcashManual) state.gcashManual = [];
  state.gcashManual.push(entry);
  save(); renderView();
  showGcashReceiptPreview(entry);
  toast('GCash transaction recorded.','ok');
}

    </div>

      <div class="field"><label>Amount (₱)</label><input type="number" min="0" step="0.01" id="exp-amount" placeholder="0.00"></div>
      <div class="field">
        <label>Recorded by</label>
        <div id="exp-recordedby-inner"></div>
        <input type="hidden" id="exp-recordedby">
      </div>
    </div>
    <div class="field"><label>Reason</label><textarea id="exp-reason" rows="2" placeholder="e.g. Bought cleaning supplies, paid for delivery fee"></textarea></div>
  `, `<button class="btn btn-ghost" data-action="close-modal">Cancel</button><button class="btn btn-danger-solid" id="exp-record-confirm">Record Expense</button>`, {maxWidth:'560px'});

  renderIdentifyField('exp-recordedby-inner', 'exp-recordedby');

  document.querySelectorAll('input[name="exp-channel"]').forEach(r=>{
    r.addEventListener('change', ()=>{
      document.querySelectorAll('input[name="exp-channel"]').forEach(x=> x.closest('.radio-opt').classList.toggle('checked', x.checked));
    });
  });

  document.getElementById('exp-record-confirm').addEventListener('click', ()=>{
    const dtStr = document.getElementById('exp-datetime').value;
    if(!dtStr){ toast('Set the date and time.','err'); return; }
    const ts = new Date(dtStr).getTime();
    if(isNaN(ts)){ toast('That date/time is not valid.','err'); return; }
    const channel = document.querySelector('input[name="exp-channel"]:checked')?.value || 'store';
    const amount = round2(Number(document.getElementById('exp-amount').value)||0);
    if(amount<=0){ toast('Enter an amount greater than 0.','err'); return; }
    const reason = document.getElementById('exp-reason').value.trim();
    if(!reason){ toast('Enter a reason for this expense.','err'); return; }
    const recordedByHidden = document.getElementById('exp-recordedby');
    if(!recordedByHidden.value){ toast('Scan an ID barcode or enter a passcode for "Recorded by".','err'); return; }
    const recordedByUserId = recordedByHidden.dataset.userId || null;
    const recordedByUserName = recordedByHidden.value;

    // If this expense is dated today and the day is currently open, don't let it
    // exceed what's actually expected in that channel's drawer right now.
    const isToday = localDateStr(ts) === todayStr();
    if(isToday && state.session.dayOpen){
      const s = computeDaySummary();
      const available = channel==='gcash' ? s.expectedGcashCash : s.expectedCash;
      if(amount > available + 0.004){ toast(`Only ${fmt(available)} available in the ${channel==='gcash'?'GCash':'store'} drawer today.`,'err'); return; }
    }

    requireAuth(`Expense — ${channel==='gcash'?'GCash':'Store'}`, ()=>{
      if(!state.cashAdjustments) state.cashAdjustments = [];
      state.cashAdjustments.push({
        id: uid('cadj'), type:'withdraw', channel, amount, reason, date: ts,
        dayLogId: (isToday && state.session.dayOpen) ? state.session.currentDayLogId : null,
        recordedByUserId, recordedByUserName
      });
      save(); renderView();
      toast(`Expense of ${fmt(amount)} recorded for ${channel==='gcash'?'GCash':'Store'}.`,'ok');
    });
  });
}

function todaysSales(){ const d = todayStr(); return state.sales.filter(s=> localDateStr(s.date)===d && !s.voided); }
function todaysLayawayPayments(){
  const d = todayStr();
  const out = [];
  state.layaways.forEach(l=> l.payments.forEach(p=>{ if(localDateStr(p.date)===d) out.push(p); }));
  return out;
}
function lookupGcashFee(amount){
  const schedule = state.meta.gcashFeeSchedule || [];
  const tier = schedule.find(t=> amount >= Number(t.min) && amount <= Number(t.max));
  return tier ? Number(tier.fee) : null;
}

function todaysGcashManual(){
  const d = todayStr();
  return (state.gcashManual||[]).filter(m=> localDateStr(m.date)===d);
}
function todaysGcashWalletAdjustments(){
  const d = todayStr();
  return (state.gcashWalletAdjustments||[]).filter(a=> localDateStr(a.date)===d);
}
function todaysCashAdjustments(channel){
  const d = todayStr();
  return (state.cashAdjustments||[]).filter(a=> localDateStr(a.date)===d && (a.channel||'store')===(channel||'store'));
}

function computeDaySummary(){
  const sales = todaysSales();
  const layPays = todaysLayawayPayments();
  const cashSales = sales.reduce((a,s)=> a + (s.paymentMethod==='cash'? s.total : s.paymentMethod==='split'? (s.splitCash||0) : 0), 0);
  const gcashSales = sales.reduce((a,s)=> a + (s.paymentMethod==='gcash'? s.total : s.paymentMethod==='split'? (s.splitGcash||0) : 0), 0);
  const layGcash = layPays.filter(p=>p.method==='gcash').reduce((a,p)=>a+p.amount,0);
  const layCashTotal = layPays.filter(p=>p.method!=='gcash').reduce((a,p)=>a+p.amount,0);
  const totalSales = sales.reduce((a,s)=>a+s.total,0);
  const totalLayPays = layPays.reduce((a,p)=>a+p.amount,0);
  const currentLog = state.session.dayOpen && state.session.currentDayLogId ? state.dayLogs.find(d=>d.id===state.session.currentDayLogId) : null;
  const openingFloat = currentLog? (currentLog.openingFloat||0) : 0;
  const gcashOpeningFloat = currentLog? (currentLog.gcashOpeningFloat||0) : 0;
  const gcashWalletOpening = currentLog? (currentLog.gcashWalletOpening||0) : 0;
  const cashAdjustments = todaysCashAdjustments('store');
  const cashAdded = cashAdjustments.filter(a=>a.type==='add').reduce((a,c)=>a+c.amount,0);
  const cashWithdrawn = cashAdjustments.filter(a=>a.type==='withdraw').reduce((a,c)=>a+c.amount,0);
  const expectedCash = round2(openingFloat + cashSales + layCashTotal + cashAdded - cashWithdrawn);

  const gcashCashAdjustments = todaysCashAdjustments('gcash');
  const gcashCashAdjustAdded = gcashCashAdjustments.filter(a=>a.type==='add').reduce((a,c)=>a+c.amount,0);
  const gcashCashAdjustWithdrawn = gcashCashAdjustments.filter(a=>a.type==='withdraw').reduce((a,c)=>a+c.amount,0);

  const gcashTxns = todaysGcashManual();
  const gcashCashInTxns = gcashTxns.filter(m=>{ const t=m.type||'Cash-In'; return t==='Cash-In' || t==='Load'; });
  const gcashCashOutTxns = gcashTxns.filter(m=>m.type==='Cash-Out');
  const gcashCashIn = gcashCashInTxns.reduce((a,m)=>a+m.amount,0);
  const gcashCashOut = gcashCashOutTxns.reduce((a,m)=>a+m.amount,0);
  const gcashCashInFees = gcashCashInTxns.reduce((a,m)=>a+(m.serviceFee||0),0);
  const gcashCashOutFees = gcashCashOutTxns.reduce((a,m)=>a+(m.serviceFee||0),0);
  const gcashFees = gcashCashInFees + gcashCashOutFees;
  // Cash-out fees are kept by the store (deducted from what's handed to the customer), so they're
  // added back here just like cash-in fees — both increase the cash actually on hand. This math
  // is the same regardless of whether the fee was "additional" or "deducted from the amount",
  // since either way the store ends up keeping the fee in cash.
  const expectedGcashCash = round2(gcashOpeningFloat + gcashCashIn + gcashCashInFees - gcashCashOut + gcashCashOutFees + gcashCashAdjustAdded - gcashCashAdjustWithdrawn);
  // GCash e-wallet balance: Cash-In sends money OUT of your wallet to the customer (subtract);
  // Cash-Out receives money INTO your wallet from the customer (add). Fees are kept as cash, not GCash.
  // Manual top-ups (e.g. bank transfer, cashing in personal funds) add directly to the wallet balance.
  // Unlike the cash side, this DOES depend on the "fee included" flag: if the fee was deducted from
  // the stated amount rather than charged separately, only the net (amount − fee) actually moved
  // through GCash — the full stated amount never really hit the wallet.
  const walletAmt = (m)=> m.feeIncluded ? round2(m.amount - (m.serviceFee||0)) : m.amount;
  const gcashWalletCashIn = gcashCashInTxns.reduce((a,m)=>a+walletAmt(m),0);
  const gcashWalletCashOut = gcashCashOutTxns.reduce((a,m)=>a+walletAmt(m),0);
  const gcashWalletAdjustments = todaysGcashWalletAdjustments();
  const gcashWalletTopUps = gcashWalletAdjustments.filter(a=>(a.type||'add')==='add').reduce((a,c)=>a+c.amount,0);
  const gcashWalletWithdrawals = gcashWalletAdjustments.filter(a=>a.type==='withdraw').reduce((a,c)=>a+c.amount,0);
  const gcashWalletBalance = round2(gcashWalletOpening + gcashWalletTopUps - gcashWalletWithdrawals - gcashWalletCashIn + gcashWalletCashOut);

  return { sales, layPays, cashSales, gcashSales, layGcash, layCashTotal, totalSales, totalLayPays,
    openingFloat, expectedCash, cashAdjustments, cashAdded, cashWithdrawn, gcashOpeningFloat, gcashCashIn, gcashCashOut, gcashFees, gcashCashInFees, gcashCashOutFees, expectedGcashCash,
    gcashCashAdjustments, gcashCashAdjustAdded, gcashCashAdjustWithdrawn, gcashWalletAdjustments, gcashWalletTopUps, gcashWalletWithdrawals,
    gcashWalletOpening, gcashWalletBalance,
    transactionCount: sales.length, voidCount: state.sales.filter(s=>{const d=todayStr(); return localDateStr(s.date)===d && s.voided;}).length };
}

/* ---- date range helpers ---- */
function inRange(dateVal, from, to){
  const d = localDateStr(dateVal);
  if(from && d < from) return false;
  if(to && d > to) return false;
  return true;
}
function salesInRange(from, to){ return [...state.sales].filter(s=>inRange(s.date, from, to)).sort((a,b)=>b.date-a.date); }
function layawayPaymentsInRange(from, to){
  const out = [];
  state.layaways.forEach(l=> l.payments.forEach(p=> { if(inRange(p.date, from, to)) out.push({...p, layaway:l}); }));
  return out.sort((a,b)=>b.date-a.date);
}
function layawaysInRange(from, to){ return [...state.layaways].filter(l=>inRange(l.createdAt, from, to)).sort((a,b)=>b.createdAt-a.createdAt); }
function dayLogsInRange(from, to){ return [...state.dayLogs].filter(l=> (!from||l.date>=from) && (!to||l.date<=to)).sort((a,b)=>b.openedAt-a.openedAt); }
function cashAdjustmentsInRange(from, to){ return [...(state.cashAdjustments||[])].filter(a=>inRange(a.date, from, to)).sort((a,b)=>b.date-a.date); }
function securityLogsInRange(from, to){ return [...(state.securityLogs||[])].filter(l=>inRange(l.date, from, to)).sort((a,b)=>b.date-a.date); }
function voidLogsInRange(from, to){ return [...(state.voidLogs||[])].filter(v=>inRange(v.date, from, to)).sort((a,b)=>b.date-a.date); }

  return `

      <button class="btn btn-amber" data-action="gen-report">Generate Report</button>
      ${hasResult? `
        <button class="btn btn-ghost" data-action="gen-print">Print Report</button>
        <button class="btn btn-ghost" data-action="gen-download-excel">Download Excel</button>
        <button class="btn btn-ghost" data-action="gen-download-pdf">Download PDF</button>
      `:''}
    </div>
    <div class="hint" style="margin-top:8px;">Leave a date blank to leave that side of the range open (e.g. no start date = everything up to the end date).</div>
  </div>
  <div id="gen-result">
    ${hasResult? g.appliedTypes.map(t=> `<div class="rep-section" data-report-type="${t}">${repResultHTML(t, g.appliedFrom, g.appliedTo)}</div>`).join('<div style="height:24px;"></div>')
      : `<div class="card card-pad" style="text-align:center;color:var(--ink-soft);font-style:italic;">Pick one or more report types and a date range, then click "Generate Report".</div>`}
  </div>
  `;
}

function repResultHTML(type, from, to){
  const rangeLabel = (from||to) ? `${from||'earliest'} &rarr; ${to||'latest'}` : 'All time';
  const typeLabel = REPORT_TYPES.find(t=>t.id===type)?.label || type;
  let body = '';
  if(type==='sales_summary') body = repSalesSummaryBody(from,to);
  else if(type==='sales_detail') body = repSalesDetailBody(from,to);
  else if(type==='sales_by_department') body = repSalesByDepartmentBody(from,to);
  else if(type==='gcash') body = repGcashBody(from,to);
  else if(type==='layaway') body = repLayawayBody(from,to);
  else if(type==='cash_adjustments') body = repCashAdjustmentsBody(from,to);
  else if(type==='expense_log') body = repExpenseLogBody(from,to);
  else if(type==='day_logs') body = repDayLogsRangeBody(from,to);
  else if(type==='low_stock') body = repLowStockBody();
  else if(type==='security_log') body = repSecurityLogBody(from,to);
  else if(type==='void_log') body = repVoidLogBody(from,to);
  return `<div class="view-title" style="margin-bottom:12px;"><h1 style="font-size:18px;">${esc(typeLabel)}</h1><div class="sub">${rangeLabel}</div></div>${body}`;
}

function repSalesSummaryBody(from,to){
  const sales = salesInRange(from,to);
  const active = sales.filter(s=>!s.voided);
  const cash = active.reduce((a,s)=> a + (s.paymentMethod==='cash'? s.total : s.paymentMethod==='split'? (s.splitCash||0) : 0), 0);
  const gcash = active.reduce((a,s)=> a + (s.paymentMethod==='gcash'? s.total : s.paymentMethod==='split'? (s.splitGcash||0) : 0), 0);
  const discounts = active.reduce((a,s)=>a+(s.discount||0),0);
  const layPays = layawayPaymentsInRange(from,to).reduce((a,p)=>a+p.amount,0);
  const voided = sales.filter(s=>s.voided).length;
  return `
  <div class="stat-cards">
    <div class="stat-card"><div class="lbl">Transactions</div><div class="val">${active.length}</div></div>
    <div class="stat-card"><div class="lbl">Cash sales</div><div class="val">${fmt(cash)}</div></div>
    <div class="stat-card"><div class="lbl">GCash sales</div><div class="val">${fmt(gcash)}</div></div>
    <div class="stat-card"><div class="lbl">Total revenue</div><div class="val">${fmt(cash+gcash)}</div></div>
    <div class="stat-card"><div class="lbl">Discounts given</div><div class="val">${fmt(discounts)}</div></div>
    <div class="stat-card"><div class="lbl">Lay-away collected</div><div class="val">${fmt(layPays)}</div></div>
    <div class="stat-card"><div class="lbl">Voided sales</div><div class="val">${voided}</div></div>
  </div>`;
}

function paymentMethodLabel(s){
  if(s.paymentMethod==='split') return `Split (Cash ${fmt(s.splitCash||0)} / GCash ${fmt(s.splitGcash||0)})`;
  return s.paymentMethod;
}

function repSalesDetailBody(from,to){
  const list = salesInRange(from,to);
  const rows = list.length? list.map(s=>{
    const cust = s.customerId? getCust(s.customerId):null;
    return `<tr>
      <td>${s.receiptNo}</td><td>${new Date(s.date).toLocaleString('en-PH')}</td>
      <td>${cust?esc(cust.name):'Walk-in'}</td><td>${esc(paymentMethodLabel(s))}</td>

    </tr>`;

  return `<div class="card"><div class="tbl-wrap"><table>
    <thead><tr><th>Receipt</th><th>Date/Time</th><th>Customer</th><th>Method</th><th>Total</th><th>Status</th></tr></thead>
    <tbody>${rows}</tbody></table></div></div>`;
}

function repSalesByDepartmentBody(from,to){
  const list = salesInRange(from,to).filter(s=>!s.voided);
  const byDept = {}; // deptId -> {name, qty, revenue}
  let grandTotal = 0;

  list.forEach(s=>{
    s.items.forEach(it=>{
      const prod = getProd(it.productId);
      const deptId = prod ? prod.departmentId : null;
      const dept = deptId ? getDept(deptId) : null;
      const key = dept ? dept.id : '__unknown__';
      const name = dept ? dept.name : 'Unknown / Deleted Product';
      if(!byDept[key]) byDept[key] = {name, qty:0, revenue:0};
      byDept[key].qty += it.qty;
      byDept[key].revenue += it.subtotal;
      grandTotal += it.subtotal;
    });
  });

  const rowsData = Object.values(byDept).sort((a,b)=>b.revenue-a.revenue);
  const rows = rowsData.length? rowsData.map(d=>`<tr>
    <td>${esc(d.name)}</td>
    <td class="num">${d.qty}</td>
    <td class="num">${fmt(d.revenue)}</td>
    <td class="num">${grandTotal>0? ((d.revenue/grandTotal)*100).toFixed(1) : '0.0'}%</td>
  </tr>`).join('') : `<tr class="empty-row"><td colspan="4">No sales in this range.</td></tr>`;

  return `
  <div class="stat-cards">
    <div class="stat-card"><div class="lbl">Departments with sales</div><div class="val">${rowsData.length}</div></div>
    <div class="stat-card"><div class="lbl">Total revenue</div><div class="val">${fmt(grandTotal)}</div></div>
  </div>
  <div class="hint" style="margin:-8px 0 12px;">Revenue is item subtotal (qty × price) before any whole-sale discount is applied.</div>
  <div class="card"><div class="tbl-wrap"><table>
    <thead><tr><th>Department</th><th>Items Sold</th><th>Revenue</th><th>% of Total</th></tr></thead>
    <tbody>${rows}</tbody></table></div></div>`;
}

  const totalCashOut = list.filter(t=>!t.voided && t.type==='Cash-Out').reduce((a,t)=>a+t.amount,0);
  const totalFees = list.filter(t=>!t.voided).reduce((a,t)=>a+(t.serviceFee||0),0);
  const rows = list.length? list.map(t=>{
    const cust = t.customerId? getCust(t.customerId) : null;
    return `<tr>
      <td>${new Date(t.date).toLocaleString('en-PH')}</td>
      <td><span class="badge ${gcashTypeBadgeClass(t.type)}">${esc(t.type)}</span></td>
      <td>${t.receiptNo}</td><td>${cust?esc(cust.name):(t.saleId?'Walk-in':'—')}</td>
      <td>${esc(t.processedBy||'—')}</td>
      <td class="mono">${esc(t.reference||'—')}</td>

      <td>${t.serviceFee ? (t.feeIncluded? '<span class="badge badge-amber">Included</span>' : '<span class="badge badge-blue">Separate</span>') : '—'}</td>
      <td>${t.voided? '<span class="badge badge-red">Voided</span>' : '<span class="badge badge-green">Confirmed</span>'}</td>

  }).join('') : `<tr class="empty-row"><td colspan="10">No GCash transactions in this range.</td></tr>`;
  return `
  <div class="stat-cards">
    <div class="stat-card"><div class="lbl">Total Cash-In</div><div class="val">${fmt(totalCashIn)}</div></div>
    <div class="stat-card"><div class="lbl">Total Load</div><div class="val">${fmt(totalLoad)}</div></div>

    <div class="stat-card"><div class="lbl">Service fees earned</div><div class="val">${fmt(totalFees)}</div></div>

  <div class="card"><div class="tbl-wrap"><table>

    <tbody>${rows}</tbody></table></div></div>`;
}

function bindReportEvents(){
  document.querySelectorAll('[data-action="rep-subtab"]').forEach(b=>b.addEventListener('click',()=>{ state.ui.reportSubTab=b.dataset.sub; renderView(); }));
  document.querySelectorAll('#view-container [data-action="open-close-day-modal"]').forEach(b=>b.addEventListener('click',()=>{
    if(b.dataset.mode==='open'){ requireAuth('Open Day', ()=> openDayModal('open')); }
    else { openDayModal('close'); }
  }));

  document.querySelectorAll('.gen-type-cb').forEach(cb=>{
    cb.addEventListener('change', ()=>{
      const g = state.ui.reportGen;
      if(!g.types) g.types = [];
      if(cb.checked){ if(!g.types.includes(cb.value)) g.types.push(cb.value); }
      else { g.types = g.types.filter(t=>t!==cb.value); }
      cb.closest('.radio-opt').classList.toggle('checked', cb.checked);
      save();
    });
  });
  const genFrom = document.getElementById('gen-from'); if(genFrom) genFrom.addEventListener('change', ()=>{ state.ui.reportGen.from = genFrom.value; save(); });
  const genTo = document.getElementById('gen-to'); if(genTo) genTo.addEventListener('change', ()=>{ state.ui.reportGen.to = genTo.value; save(); });
  const genBtn = document.querySelector('[data-action="gen-report"]');
  if(genBtn) genBtn.addEventListener('click', ()=>{
    const g = state.ui.reportGen;
    if(!g.types || !g.types.length){ toast('Select at least one report type.','err'); return; }
    if(g.from && g.to && g.from > g.to){ toast('Start date is after the end date.','err'); return; }
    g.appliedTypes = [...g.types]; g.appliedFrom = g.from; g.appliedTo = g.to;
    save(); renderView(); toast('Report generated.','ok');
  });
  const printBtn = document.querySelector('[data-action="gen-print"]');
  if(printBtn) printBtn.addEventListener('click', ()=>{
    const g = state.ui.reportGen;
    printGeneratedReport(g.appliedTypes, g.appliedFrom, g.appliedTo);
  });
  const excelBtn = document.querySelector('[data-action="gen-download-excel"]');
  if(excelBtn) excelBtn.addEventListener('click', exportReportsExcel);
  const pdfBtn = document.querySelector('[data-action="gen-download-pdf"]');
  if(pdfBtn) pdfBtn.addEventListener('click', exportReportsPDF);

  const receiptScan = document.getElementById('f-receipt-scan'); if(receiptScan) receiptScan.addEventListener('input',()=>{ state.ui.salesFilterReceipt=receiptScan.value; renderView(); });
  const from = document.getElementById('f-from'); if(from) from.addEventListener('change',()=>{ state.ui.salesFilterFrom=from.value; renderView(); });
  const to = document.getElementById('f-to'); if(to) to.addEventListener('change',()=>{ state.ui.salesFilterTo=to.value; renderView(); });
  const method = document.getElementById('f-method'); if(method) method.addEventListener('change',()=>{ state.ui.salesFilterMethod=method.value; renderView(); });

  document.querySelectorAll('[data-action="reprint-sale"]').forEach(b=>b.addEventListener('click',()=>{
    const s = state.sales.find(x=>x.id===b.dataset.id); if(s) printReceipt({type:'sale', record:s});
  }));
  document.querySelectorAll('[data-action="void-sale"]').forEach(b=>b.addEventListener('click',()=>{
    const s = state.sales.find(x=>x.id===b.dataset.id); if(!s) return;
    openVoidSaleModal(s.receiptNo);
  }));
}

function tableToAOA(tableEl){
  const rows = [];
  tableEl.querySelectorAll('tr').forEach(tr=>{
    const cells = [...tr.children].map(td=> td.textContent.trim());
    rows.push(cells);
  });
  return rows;
}

function statCardsToLines(container){
  const lines = [];
  container.querySelectorAll('.stat-card').forEach(c=>{
    const lbl = c.querySelector('.lbl')?.textContent.trim()||'';
    const val = c.querySelector('.val')?.textContent.trim()||'';
    if(lbl) lines.push([lbl, val]);
  });
  return lines;
}

function exportReportsExcel(){
  const g = state.ui.reportGen;
  if(!g.appliedTypes || !g.appliedTypes.length){ toast('Generate a report first.','err'); return; }
  if(typeof XLSX === 'undefined'){ toast('Excel export library did not load — check your internet connection.','err'); return; }
  const wb = XLSX.utils.book_new();
  const rangeLabel = (g.appliedFrom||g.appliedTo) ? `${g.appliedFrom||'Earliest'} to ${g.appliedTo||'Latest'}` : 'All time';

  g.appliedTypes.forEach(t=>{
    const section = document.querySelector(`#gen-result .rep-section[data-report-type="${t}"]`);
    if(!section) return;
    const label = REPORT_TYPES.find(rt=>rt.id===t)?.label || t;
    const aoa = [[label], [`Range: ${rangeLabel}`], []];
    const statLines = statCardsToLines(section);
    if(statLines.length){ aoa.push(...statLines); aoa.push([]); }
    section.querySelectorAll('table').forEach(table=>{ aoa.push(...tableToAOA(table)); aoa.push([]); });

    const ws = XLSX.utils.aoa_to_sheet(aoa);
    let sheetName = label.replace(/[:\\/?*\[\]]/g,'').slice(0,31) || 'Report';
    let unique = sheetName, n = 1;
    while(wb.SheetNames.includes(unique)){ unique = (sheetName.slice(0,28) + '_' + n); n++; }
    XLSX.utils.book_append_sheet(wb, ws, unique);
  });

  if(!wb.SheetNames.length){ toast('Nothing to export.','err'); return; }
  XLSX.writeFile(wb, `reports-${todayStr()}.xlsx`);
  toast('Reports exported to Excel.','ok');
}

function exportReportsPDF(){
  const g = state.ui.reportGen;
  if(!g.appliedTypes || !g.appliedTypes.length){ toast('Generate a report first.','err'); return; }
  if(typeof window.jspdf === 'undefined'){ toast('PDF export library did not load — check your internet connection.','err'); return; }
  const { jsPDF } = window.jspdf;
  const doc = new jsPDF();
  const rangeLabel = (g.appliedFrom||g.appliedTo) ? `${g.appliedFrom||'Earliest'} to ${g.appliedTo||'Latest'}` : 'All time';

  g.appliedTypes.forEach((t, idx)=>{
    const section = document.querySelector(`#gen-result .rep-section[data-report-type="${t}"]`);
    if(!section) return;
    const label = REPORT_TYPES.find(rt=>rt.id===t)?.label || t;
    if(idx>0) doc.addPage();

    doc.setFontSize(14);
    doc.text(state.meta.businessName || 'Reports', 14, 16);
    doc.setFontSize(10);
    doc.text(`${label} · ${rangeLabel} · Generated ${new Date().toLocaleString('en-PH')}`, 14, 22);
    let y = 30;

    const statLines = statCardsToLines(section);
    if(statLines.length){
      doc.setFontSize(9);
      statLines.forEach(([lbl,val])=>{ doc.text(`${lbl}: ${val}`, 14, y); y += 5; });
      y += 3;
    }

    section.querySelectorAll('table').forEach(table=>{
      const aoa = tableToAOA(table);
      if(!aoa.length) return;
      doc.autoTable({
        startY: y,
        head: [aoa[0]],
        body: aoa.slice(1),
        styles:{ fontSize:8 },
        headStyles:{ fillColor:[20,85,90] },
        margin:{left:14, right:14}
      });
      y = doc.lastAutoTable.finalY + 8;
    });
  });

  doc.save(`reports-${todayStr()}.pdf`);
  toast('Reports exported to PDF.','ok');
}

function openVoidSaleModal(prefillReceiptNo){
  openModal('Void Sale', `
    <div class="field" id="vs-search-field">
      <label>Scan or type receipt barcode</label>
      <div class="ac-wrap">
        <input type="text" id="vs-search" placeholder="Scan barcode or type receipt #" autocomplete="off" value="${esc(prefillReceiptNo||'')}">
        <div id="vs-results" class="ac-list" style="display:none;"></div>
      </div>
    </div>
    <div id="vs-details"></div>
  `, `<button class="btn btn-ghost" data-action="close-modal">Cancel</button><button class="btn btn-danger-solid" id="vs-confirm" disabled>Void Sale</button>`, {maxWidth:'620px', tallBody:true});

  let foundSale = null;
  const searchInp = document.getElementById('vs-search');
  const resultsBox = document.getElementById('vs-results');
  const detailsEl = document.getElementById('vs-details');
  const confirmBtn = document.getElementById('vs-confirm');

  const renderDetails = ()=>{
    if(!foundSale){ detailsEl.innerHTML=''; confirmBtn.disabled = true; return; }
    if(foundSale.voided){
      detailsEl.innerHTML = `<div class="hint" style="margin:10px 0;color:var(--red);">Receipt <strong>${foundSale.receiptNo}</strong> has already been fully voided.</div>`;
      confirmBtn.disabled = true;
      return;
    }
    const cust = foundSale.customerId ? getCust(foundSale.customerId) : null;
    detailsEl.innerHTML = `
      <div class="hint" style="margin:10px 0;">Receipt <strong>${foundSale.receiptNo}</strong> — ${new Date(foundSale.date).toLocaleString('en-PH')} — ${cust?esc(cust.name):'Walk-in'} — Total <strong>${fmt(foundSale.total)}</strong></div>
      <div class="field">
        <label>Void scope</label>
        <div class="radio-row">
          <label class="radio-opt checked"><input type="radio" name="vs-scope" value="full" checked> Whole sale</label>
          <label class="radio-opt"><input type="radio" name="vs-scope" value="item"> Void or refund a specific item</label>
        </div>
      </div>
      <div id="vs-item-wrap" style="display:none;">
        <label>Select the item to void / refund</label>
        <div class="tbl-wrap" style="margin:6px 0 14px;">
          <table>
            <thead><tr><th></th><th>Item</th><th>Qty</th><th>Price</th><th>Subtotal</th></tr></thead>
            <tbody>
              ${foundSale.items.map((it,idx)=>`
                <tr class="vs-item-row ${idx===0?'selected':''}" data-idx="${idx}" style="cursor:pointer;">
                  <td><input type="radio" name="vs-item-radio" value="${idx}" ${idx===0?'checked':''} disabled style="pointer-events:none;"></td>
                  <td>${esc(it.name)}</td>
                  <td class="num">${it.qty}</td>
                  <td class="num">${fmt(it.price)}</td>
                  <td class="num">${fmt(it.subtotal)}</td>
                </tr>`).join('')}
            </tbody>
          </table>
        </div>
      </div>
      <div class="field">
        <label>Reason</label>
        <textarea id="vs-reason" rows="2" placeholder="e.g. Customer returned item, wrong item rung up"></textarea>
      </div>
    `;
    confirmBtn.disabled = false;

    const itemRadios = ()=> document.querySelectorAll('input[name="vs-item-radio"]');
    document.querySelectorAll('.vs-item-row').forEach(row=>{
      row.addEventListener('click', ()=>{
        const radio = row.querySelector('input');
        if(radio.disabled) return;
        radio.checked = true;
        document.querySelectorAll('.vs-item-row').forEach(r=> r.classList.toggle('selected', r===row));
      });
    });
    document.querySelectorAll('input[name="vs-scope"]').forEach(r=>{
      r.addEventListener('change', ()=>{
        const isItem = r.value==='item' && r.checked;
        document.getElementById('vs-item-wrap').style.display = isItem ? 'block':'none';
        itemRadios().forEach(radio=> radio.disabled = !isItem);
        document.querySelectorAll('input[name="vs-scope"]').forEach(x=> x.closest('.radio-opt').classList.toggle('checked', x.checked));
      });
    });
  };

  const selectSale = (sale)=>{
    foundSale = sale;
    resultsBox.style.display='none';
    renderDetails();
  };

  const renderResults = (query)=>{
    const q = query.trim().toLowerCase();
    if(!q){ resultsBox.style.display='none'; resultsBox.innerHTML=''; return; }
    const matches = state.sales.filter(s=> s.receiptNo.toLowerCase().includes(q)).sort((a,b)=>b.date-a.date).slice(0,8);
    if(!matches.length){
      resultsBox.innerHTML = `<div class="ac-item" style="cursor:default;color:var(--ink-soft);">No matching receipts</div>`;
      resultsBox.style.display='block';
      return;
    }
    resultsBox.innerHTML = matches.map(s=>`<div class="ac-item" data-id="${s.id}"><div>${s.receiptNo}</div><div class="ac-sub">${new Date(s.date).toLocaleString('en-PH')} · ${fmt(s.total)}${s.voided?' · Voided':''}</div></div>`).join('');
    resultsBox.style.display='block';
    resultsBox.querySelectorAll('.ac-item[data-id]').forEach(el=>{
      el.addEventListener('click', ()=>{
        const s = state.sales.find(x=>x.id===el.dataset.id);
        searchInp.value = s.receiptNo;
        selectSale(s);
      });
    });
  };

  searchInp.addEventListener('input', ()=>{ foundSale=null; renderDetails(); renderResults(searchInp.value); });
  searchInp.addEventListener('focus', ()=>{ if(searchInp.value.trim() && !foundSale) renderResults(searchInp.value); });
  searchInp.addEventListener('blur', ()=>{ setTimeout(()=>{ resultsBox.style.display='none'; }, 150); });
  searchInp.addEventListener('keydown', (e)=>{
    if(e.key!=='Enter') return;
    e.preventDefault();
    const val = searchInp.value.trim();
    if(!val) return;
    const exact = state.sales.find(s=> s.receiptNo===val);
    if(exact){ selectSale(exact); return; }
    const matches = state.sales.filter(s=> s.receiptNo.toLowerCase().includes(val.toLowerCase()));
    if(matches.length===1){ selectSale(matches[0]); }
    else if(matches.length>1){ toast('Multiple matches — pick one from the list below.','err'); }
    else { toast(`No sale found for receipt "${val}".`,'err'); }
  });

  confirmBtn.addEventListener('click', ()=>{
    if(!foundSale){ toast('Find a sale first.','err'); return; }
    const scope = document.querySelector('input[name="vs-scope"]:checked')?.value || 'full';
    const itemIdx = scope==='item' ? Number(document.querySelector('input[name="vs-item-radio"]:checked')?.value) : null;
    if(scope==='item' && (itemIdx===null || isNaN(itemIdx))){ toast('Select which item to void.','err'); return; }
    const reason = document.getElementById('vs-reason').value.trim();
    if(!reason){ toast('Enter a reason for the void.','err'); return; }
    requireAuth('Void Sale — Store', (user)=>{ performVoidSale(foundSale, scope, itemIdx, reason, user); });
  });

  searchInp.focus();
  if(prefillReceiptNo){
    const exact = state.sales.find(s=> s.receiptNo===prefillReceiptNo);
    if(exact) selectSale(exact);
  }
}

function performVoidSale(sale, scope, itemIdx, reason, user){
  let amountReturned = 0;
  let itemLabel = null;
  if(scope==='full'){
    sale.items.forEach(it=>{ const p=getProd(it.productId); if(p && !p.nonInventory) p.stock += it.qty; });
    amountReturned = sale.total;
    sale.voided = true;
  } else {
    const item = sale.items[itemIdx];
    if(!item){ toast('Item not found.','err'); return; }
    const p = getProd(item.productId);
    if(p && !p.nonInventory) p.stock += item.qty;
    amountReturned = item.subtotal;
    itemLabel = `${item.name} x${item.qty}`;
    sale.items.splice(itemIdx,1);
    if(sale.items.length===0){
      sale.voided = true;
      sale.subtotal = 0; sale.discount = 0; sale.tax = 0; sale.total = 0;
    } else {
      sale.subtotal = round2(sale.items.reduce((a,it)=>a+it.subtotal,0));
      sale.discount = Math.min(sale.discount||0, sale.subtotal);
      sale.tax = round2((sale.subtotal - sale.discount) * (Number(state.meta.taxRate)||0)/100);
      sale.total = round2(sale.subtotal - sale.discount + sale.tax);
    }
  }
  if(!state.voidLogs) state.voidLogs = [];
  state.voidLogs.push({
    id: uid('void'), date: Date.now(), saleId: sale.id, receiptNo: sale.receiptNo,
    scope, itemLabel, amountReturned, reason, userId: user.id, userName: user.name
  });
  save(); renderView();
  toast(scope==='full' ? `Sale ${sale.receiptNo} voided.` : `${itemLabel} voided from ${sale.receiptNo}.`, 'ok');
}

  openModal(isAdd? 'Add GCash Balance' : 'Withdraw GCash Balance', `

      ? `Use this when you've topped up your actual GCash e-wallet mid-day (e.g. bank transfer, cashing in personal funds) — it adds directly to your tracked GCash Balance, separate from GCash Cash on Hand.`
      : `Use this when money has left your actual GCash e-wallet outside of normal Cash-In/Cash-Out/Load transactions (e.g. paying a supplier via GCash, transferring funds out) — it subtracts directly from your tracked GCash Balance.`}</div>
    <div class="field"><label>Amount (₱)</label><input type="number" min="0" step="0.01" id="m-gwb-amount" placeholder="0.00"></div>
    <div class="field"><label>Reason (optional)</label><input type="text" id="m-gwb-reason" placeholder="${isAdd? 'e.g. Bank transfer top-up' : 'e.g. Paid supplier via GCash'}"></div>
  `, `<button class="btn btn-ghost" data-action="close-modal">Cancel</button><button class="btn ${isAdd?'btn-primary':'btn-danger-solid'}" id="m-gwb-save">${isAdd?'Add Balance':'Withdraw Balance'}</button>`);

  const amtInp = document.getElementById('m-gwb-amount');
  amtInp.focus();

  document.getElementById('m-gwb-save').addEventListener('click', ()=>{
    const amount = round2(Number(amtInp.value)||0);
    if(amount<=0){ toast('Enter an amount greater than 0.','err'); return; }
    if(!isAdd){
      const s = computeDaySummary();
      if(amount > s.gcashWalletBalance + 0.004){ toast(`Only ${fmt(s.gcashWalletBalance)} available in the GCash balance.`,'err'); return; }
    }
    const reason = document.getElementById('m-gwb-reason').value.trim();

    requireAuth(isAdd? 'Add GCash Balance' : 'Withdraw GCash Balance', (user)=>{
      if(!state.gcashWalletAdjustments) state.gcashWalletAdjustments = [];
      state.gcashWalletAdjustments.push({
        id: uid('gwa'), date: Date.now(), amount, type, reason,
        dayLogId: state.session.currentDayLogId, userId: user.id, userName: user.name
      });
      save(); closeModal(); render();
      toast(`${fmt(amount)} ${isAdd?'added to':'withdrawn from'} GCash Balance.`,'ok');
    });
  });
}

function openCashAdjustModal(type, channel){
  channel = channel || 'store';
  const isGcash = channel === 'gcash';
  if(!state.session.dayOpen){ toast('Open the day first.','err'); return; }
  const isAdd = type==='add';
  const label = isGcash ? 'GCash' : 'Store';
  openModal(isAdd? `Add Money to ${label} Cash` : `Withdraw Money from ${label} Cash`, `
    <div class="hint" style="margin-bottom:10px;">${isAdd? `This adds to the expected cash total for ${label} Sales only (e.g. topping up the till, owner cash-in).` : `This subtracts from the expected cash total for ${label} Sales only (e.g. petty cash, owner withdrawal).`}</div>
    <div class="field"><label>Amount (₱)</label><input id="m-amount" type="number" min="0" step="0.01" placeholder="0.00"></div>
    <div class="field"><label>Reason (optional)</label><input id="m-reason" placeholder="${isAdd? 'e.g. Owner top-up, change fund' : 'e.g. Petty cash, owner withdrawal'}"></div>
  `, `<button class="btn btn-ghost" data-action="close-modal">Cancel</button><button class="btn ${isAdd?'btn-primary':'btn-amber'}" id="m-save">${isAdd? 'Add Money':'Withdraw Money'}</button>`);

  const amtInp = document.getElementById('m-amount');
  amtInp.focus();

  document.getElementById('m-save').addEventListener('click', ()=>{
    const amount = round2(Number(amtInp.value)||0);
    if(amount<=0){ toast('Enter an amount greater than 0.','err'); return; }
    if(!isAdd){
      const s = computeDaySummary();
      const available = isGcash ? s.expectedGcashCash : s.expectedCash;
      if(amount > available + 0.004){ toast(`Only ${fmt(available)} available in the ${label.toLowerCase()} drawer.`,'err'); return; }
    }
    const reason = document.getElementById('m-reason').value.trim();
    requireAuth(isAdd? `Add Money — ${label}` : `Withdraw Money — ${label}`, ()=>{
      if(!state.cashAdjustments) state.cashAdjustments = [];
      state.cashAdjustments.push({id:uid('cadj'), type, channel, amount, reason, date: Date.now(), dayLogId: state.session.currentDayLogId});
      save(); closeModal(); render();
      toast(isAdd? `${fmt(amount)} added to ${label.toLowerCase()} cash.` : `${fmt(amount)} withdrawn from ${label.toLowerCase()} cash.`, 'ok');
    });
  });
}

function openDayModal(mode){
  if(mode==='open'){
    openModal('Open Day', `
      <div class="field"><label>Opening cash — Store</label><input id="m-float" type="number" min="0" step="0.01" value="0"></div>
      <div class="field"><label>Opening cash — GCash</label><input id="m-gcashfloat" type="number" min="0" step="0.01" value="0"></div>
      <div class="field"><label>GCash wallet balance (starting today)</label><input id="m-gcashwallet" type="number" min="0" step="0.01" value="0"></div>
      <div class="hint" style="margin-top:-6px;">The actual balance in your GCash app right now. Cash-In and Load transactions will subtract from this running total, Cash-Out transactions will add to it.</div>
      <div class="field"><label>Notes (optional)</label><textarea id="m-notes" rows="2"></textarea></div>
    `, `<button class="btn btn-ghost" data-action="close-modal">Cancel</button><button class="btn btn-amber" id="m-save">Open Day</button>`);
    document.getElementById('m-save').addEventListener('click', ()=>{
      const floatAmt = Number(document.getElementById('m-float').value)||0;
      const gcashFloatAmt = Number(document.getElementById('m-gcashfloat').value)||0;
      const gcashWalletAmt = Number(document.getElementById('m-gcashwallet').value)||0;
      const log = {
        id:uid('day'), date: todayStr(), openedAt: Date.now(),
        openingFloat: floatAmt, gcashOpeningFloat: gcashFloatAmt, gcashWalletOpening: gcashWalletAmt,
        closedAt:null, closingCount:null, expectedCash:null, variance:null,
        gcashClosingCount:null, gcashExpectedCash:null, gcashVariance:null,
        totalSales:null, notes: document.getElementById('m-notes').value.trim()
      };
      state.dayLogs.push(log);
      state.session.dayOpen = true; state.session.currentDayLogId = log.id;
      save(); closeModal(); render(); toast('Day opened. Ready to sell!','ok');
    });
  } else {
    const s = computeDaySummary();
    openModal('Close Day', `
      <p class="hint">Expected Store cash: <strong class="mono">${fmt(s.expectedCash)}</strong> (opening float + cash sales + cash lay-away payments + cash added − cash withdrawn)</p>
      <div class="field"><label>Actual counted cash — Store</label><input id="m-count" type="number" min="0" step="0.01" value="${s.expectedCash.toFixed(2)}"></div>
      <p class="hint">Expected GCash cash: <strong class="mono">${fmt(s.expectedGcashCash)}</strong> (opening float + cash-in + cash-in fees − cash-out + cash-out fees + cash added − cash withdrawn)</p>
      <div class="field"><label>Actual counted cash — GCash</label><input id="m-gcashcount" type="number" min="0" step="0.01" value="${s.expectedGcashCash.toFixed(2)}"></div>
      <div class="field"><label>Closing notes (optional)</label><textarea id="m-notes" rows="2"></textarea></div>
    `, `<button class="btn btn-ghost" data-action="close-modal">Cancel</button><button class="btn btn-primary" id="m-save">Close Day</button>`);
    document.getElementById('m-save').addEventListener('click', ()=>{
      const counted = Number(document.getElementById('m-count').value)||0;
      const gcashCounted = Number(document.getElementById('m-gcashcount').value)||0;
      const log = state.dayLogs.find(d=>d.id===state.session.currentDayLogId);
      if(log){
        log.closedAt = Date.now();
        log.closingCount = counted;
        log.expectedCash = s.expectedCash;
        log.variance = round2(counted - s.expectedCash);
        log.gcashClosingCount = gcashCounted;
        log.gcashExpectedCash = s.expectedGcashCash;
        log.gcashVariance = round2(gcashCounted - s.expectedGcashCash);
        log.totalSales = s.totalSales + s.totalLayPays;
        log.notes = (log.notes? log.notes+' | ':'') + document.getElementById('m-notes').value.trim();
      }
      state.session.dayOpen = false; state.session.currentDayLogId = null;
      save(); closeModal(); render(); toast('Day closed. Report saved.','ok');
    });
  }
}

function bindSettingsEvents(){
  document.querySelector('[data-action="save-settings"]').addEventListener('click', ()=>{
    state.meta.businessName = document.getElementById('s-name').value.trim() || 'My Store';
    state.meta.businessAddress = document.getElementById('s-address').value.trim();
    state.meta.businessContact = document.getElementById('s-contact').value.trim();
    state.meta.taxRate = Number(document.getElementById('s-tax').value)||0;
    save(); render(); toast('Settings saved.','ok');
  });

  document.querySelector('[data-action="add-user"]').addEventListener('click', ()=> openUserModal());
  document.querySelectorAll('[data-action="edit-user"]').forEach(btn=>{
    btn.addEventListener('click', ()=> openUserModal(btn.dataset.id));
  });
  document.querySelectorAll('[data-action="delete-user"]').forEach(btn=>{
    btn.addEventListener('click', ()=>{
      if(confirm('Delete this user? Past logs will keep their name for the record.')){
        state.users = state.users.filter(u=>u.id!==btn.dataset.id);
        save(); renderView(); toast('User deleted.','ok');
      }
    });
  });
  document.querySelector('[data-action="export-data"]').addEventListener('click', ()=>{
    const blob = new Blob([JSON.stringify(state,null,2)], {type:'application/json'});
    const url = URL.createObjectURL(blob);
    const a = document.createElement('a'); a.href=url; a.download = `till-backup-${todayStr()}.json`; a.click();
    URL.revokeObjectURL(url);
    toast('Backup downloaded.','ok');
  });
  const fileInput = document.getElementById('import-file');
  document.querySelector('[data-action="import-data"]').addEventListener('click', ()=> fileInput.click());
  fileInput.addEventListener('change', ()=>{
    const file = fileInput.files[0]; if(!file) return;
    const reader = new FileReader();
    reader.onload = ()=>{
      try{
        const parsed = JSON.parse(reader.result);
        if(!parsed.departments || !parsed.products){ toast('That file does not look like a valid backup.','err'); return; }
        state = parsed; save(); render(); toast('Backup imported.','ok');
      }catch(e){ toast('Could not read that file.','err'); }
    };
    reader.readAsText(file);
  });
  document.querySelector('[data-action="reset-data"]').addEventListener('click', ()=>{
    if(confirm('This will erase all products, sales, customers and reports. Continue?')){
      state = seedState(); save(); render(); toast('Data reset to sample defaults.','ok');
    }
  });

  const saveP = document.querySelector('[data-action="save-printer-settings"]');
  if(saveP) saveP.addEventListener('click', ()=>{
    state.meta.printerSettings = {
      ...state.meta.printerSettings,
      paperSize: document.getElementById('p-papersize').value,
      outputMode: document.getElementById('p-outputmode').value,
      marginTop: Number(document.getElementById('p-mtop').value)||0,
      marginRight: Number(document.getElementById('p-mright').value)||0,
      marginBottom: Number(document.getElementById('p-mbottom').value)||0,
      marginLeft: Number(document.getElementById('p-mleft').value)||0,
      hOffset: Number(document.getElementById('p-hoffset').value)||0,
      fontSizePt: Number(document.getElementById('p-fontsize').value)||10,
      baudRate: Number(document.getElementById('p-baudrate').value)||9600,
      autoOpenDrawer: document.getElementById('p-autodrawer').checked,
      autoOpenDrawerCashOnly: document.getElementById('p-cashonly').checked
    };
    if(state.meta.printerSettings.outputMode==='direct' && !printerConnected()){
      toast('Saved — but "Direct" needs a printer connected below first, or it\'ll fall back to the print dialog.','ok');
    } else {
      toast('Printer settings saved.','ok');
    }
    applyPrintCSS();
    save();
  });

  const hOffsetInp = document.getElementById('p-hoffset');
  if(hOffsetInp) hOffsetInp.addEventListener('input', ()=>{
    document.getElementById('p-hoffset-val').textContent = Number(hOffsetInp.value).toFixed(1) + 'mm';
  });

  const baudInp = document.getElementById('p-baudrate');
  if(baudInp) baudInp.addEventListener('change', ()=>{
    // Take effect immediately, since you need this set correctly before clicking
    // Connect below — no need to hit Save first just to pick a baud rate.
    state.meta.printerSettings = { ...state.meta.printerSettings, baudRate: Number(baudInp.value)||9600 };
    save();
  });

  const connectBtn = document.querySelector('[data-action="connect-drawer"]');
  if(connectBtn) connectBtn.addEventListener('click', async ()=>{ await connectDrawerPort(); });
  const disconnectBtn = document.querySelector('[data-action="disconnect-drawer"]');
  if(disconnectBtn) disconnectBtn.addEventListener('click', async ()=>{ await disconnectDrawerPort(); });
  const connectUsbBtn = document.querySelector('[data-action="connect-usb-printer"]');
  if(connectUsbBtn) connectUsbBtn.addEventListener('click', async ()=>{ await connectUsbPrinter(); });
  const disconnectUsbBtn = document.querySelector('[data-action="disconnect-usb-printer"]');
  if(disconnectUsbBtn) disconnectUsbBtn.addEventListener('click', async ()=>{ await disconnectUsbPrinter(); });

  const testPrintBtn = document.querySelector('[data-action="test-print"]');
  if(testPrintBtn) testPrintBtn.addEventListener('click', ()=>{
    const sample = {
      id:'sample', receiptNo:'TEST-0001', date:Date.now(),
      items:[
        {productId:'x1', name:'Sample Item A', qty:2, price:25, subtotal:50},
        {productId:'x2', name:'Sample Item B', qty:1, price:99.5, subtotal:99.5}
      ],
      subtotal:149.5, discount:0, tax:0, total:149.5,
      paymentMethod:'cash', tendered:200, change:50.5, gcashRef:'', customerId:null, voided:false
    };
    printReceipt({type:'sale', record:sample});
  });

  const testDrawerBtn = document.querySelector('[data-action="test-drawer"]');
  if(testDrawerBtn) testDrawerBtn.addEventListener('click', async ()=>{
    const ok = await kickCashDrawer();
    if(ok) toast('Test signal sent to drawer.','ok');
  });

  const saveGcashPrintBtn = document.querySelector('[data-action="save-gcash-printer-settings"]');
  if(saveGcashPrintBtn) saveGcashPrintBtn.addEventListener('click', ()=>{
    state.meta.gcashPrinterSettings = {
      marginTop: Number(document.getElementById('gp-mtop').value)||0,
      marginRight: Number(document.getElementById('gp-mright').value)||0,
      marginBottom: Number(document.getElementById('gp-mbottom').value)||0,
      marginLeft: Number(document.getElementById('gp-mleft').value)||0,
      hOffset: Number(document.getElementById('gp-hoffset').value)||0,
      fontSizePt: Number(document.getElementById('gp-fontsize').value)||10
    };
    save();
    toast('GCash print settings saved.','ok');
  });

  const gpHoffsetInp = document.getElementById('gp-hoffset');
  if(gpHoffsetInp) gpHoffsetInp.addEventListener('input', ()=>{
    document.getElementById('gp-hoffset-val').textContent = Number(gpHoffsetInp.value).toFixed(1) + 'mm';
  });

  const testPrintGcashBtn = document.querySelector('[data-action="test-print-gcash"]');
  if(testPrintGcashBtn) testPrintGcashBtn.addEventListener('click', ()=>{
    const sample = {
      id:'sample', receiptNo:'TEST-0001', date:Date.now(),
      type:'Cash-In', amount:70, serviceFee:5,
      processedBy:'Test User', reference:'0123456789012', note:'Sample GCash test print',
      customerId:null
    };
    printGcashReceipt(sample);
  });

  const addFeeTierBtn = document.querySelector('[data-action="add-fee-tier"]');
  if(addFeeTierBtn) addFeeTierBtn.addEventListener('click', ()=>{
    if(!state.meta.gcashFeeSchedule) state.meta.gcashFeeSchedule = [];
    state.meta.gcashFeeSchedule.push({min:0, max:0, fee:0});
    save(); renderView();
  });

  document.querySelectorAll('[data-action="remove-fee-tier"]').forEach(btn=>{
    btn.addEventListener('click', ()=>{
      const idx = Number(btn.dataset.idx);
      state.meta.gcashFeeSchedule.splice(idx,1);
      save(); renderView();
      toast('Fee tier removed.','ok');
    });
  });

  const saveFeeScheduleBtn = document.querySelector('[data-action="save-fee-schedule"]');
  if(saveFeeScheduleBtn) saveFeeScheduleBtn.addEventListener('click', ()=>{
    const rows = document.querySelectorAll('#fee-schedule-rows tr');
    const schedule = [];
    let valid = true;
    rows.forEach(row=>{
      const min = Number(row.querySelector('.fee-min').value)||0;
      const max = Number(row.querySelector('.fee-max').value)||0;
      const fee = Number(row.querySelector('.fee-amt').value)||0;
      if(max < min){ valid = false; }
      schedule.push({min, max, fee});
    });
    if(!valid){ toast('Each tier\'s Max amount must be greater than or equal to its Min amount.','err'); return; }
    state.meta.gcashFeeSchedule = schedule;
    save(); toast('Fee schedule saved.','ok');
  });
}

/* ============================================================
   KEYBOARD SHORTCUTS
============================================================ */
document.addEventListener('keydown', (e)=>{
  if(e.key === 'F5'){
    const exactBtn = document.getElementById('m-exact');
    if(exactBtn){
      e.preventDefault();
      exactBtn.click();
      return;
    }
    return; // let normal F5 (page refresh) behave when no payment modal is open
  }

  if(e.key === 'F10'){
    e.preventDefault();
    if(document.getElementById('active-modal')) return; // don't fire behind an open modal

    if(state.ui.activeTab === 'sales'){
      const btn = document.querySelector('[data-action="complete-sale"]');
      if(btn && !btn.disabled) btn.click();
    } else if(state.ui.activeTab === 'gcash'){
      const btn = document.querySelector('[data-action="record-gtx"]');
      if(btn) btn.click();
    }
    return;
  }

  if(e.key === 'Escape'){
    if(document.getElementById('active-modal')){
      closeModal();
      return;
    }
    if(state.ui.activeTab === 'sales'){
      const btn = document.querySelector('[data-action="clear-cart"]');
      if(btn) btn.click();
    }
  }
});

/* ============================================================
   LOGIN GATE — shown once per app launch, before anything else
   is accessible. Uses the same user accounts as the rest of the
   till's passcode system (Settings → Users & passcodes).
============================================================ */
function showLoginGate(){
  const appEl = document.getElementById('app');
  appEl.innerHTML = '';
  const gate = document.createElement('div');
  gate.className = 'login-gate';
  gate.id = 'login-gate';
  gate.innerHTML = `
    <div class="login-card">
      <h1>${esc(state.meta.businessName || 'Till')}</h1>
      <div class="sub">Sign in to continue</div>
      <div class="field">
        <label>User</label>
        <div id="login-user-inner"></div>
        <input type="hidden" id="login-user-hidden">
      </div>
      <div id="login-err" class="hint" style="color:var(--red);display:none;margin-top:6px;">Not recognized. Try again.</div>
      <button type="button" class="btn btn-primary btn-block" id="login-confirm" style="margin-top:14px;">Sign In</button>
    </div>
  `;
  document.body.appendChild(gate);

  renderIdentifyField('login-user-inner', 'login-user-hidden');

  const attempt = ()=>{
    const hidden = document.getElementById('login-user-hidden');
    const errEl = document.getElementById('login-err');
    if(!hidden.value){ errEl.style.display='block'; return; }
    errEl.style.display = 'none';
    gate.remove();
    render();
  };

  document.getElementById('login-confirm').addEventListener('click', attempt);
  gate.addEventListener('keydown', (e)=>{ if(e.key==='Enter'){ e.preventDefault(); attempt(); } });
}

/* ============================================================
   INIT
============================================================ */
showLoginGate();

// Register the service worker so this can be installed as a PWA (and later
// wrapped as an Android APK via Trusted Web Activity). Safe no-op if sw.js
// isn't present yet (e.g. testing this single file directly via file://).
if('serviceWorker' in navigator && (location.protocol==='https:' || location.hostname==='localhost')){
  navigator.serviceWorker.register('sw.js').catch(()=>{ /* sw.js not deployed yet — fine, app still works normally */ });
}
</script>
