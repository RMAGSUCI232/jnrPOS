<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Till &mdash; Point of Sale</title>
<link rel="manifest" href="manifest.json">
<meta name="theme-color" content="#14555A">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="apple-mobile-web-app-title" content="Till">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Fraunces:opsz,wght@9..144,400;9..144,600;9..144,700&family=Inter:wght@400;500;600;700&family=IBM+Plex+Mono:wght@400;500;600&display=swap" rel="stylesheet">
<style>
:root{
  --paper:#F6F4EE;
  --surface:#FFFFFF;
  --ink:#1E2A2E;
  --ink-soft:#5B6B67;
  --border:#E4E0D3;
  --teal:#14555A;
  --teal-dark:#0E3F43;
  --teal-tint:#E7EFEE;
  --amber:#E1962B;
  --amber-dark:#C67D18;
  --green:#2F8F5B;
  --green-tint:#E8F5EE;
  --red:#C24444;
  --red-tint:#FBEBEB;
  --radius:10px;
  --shadow: 0 1px 2px rgba(30,42,46,0.06), 0 6px 20px rgba(30,42,46,0.06);
}
*{box-sizing:border-box;}
html,body{height:100%;}
body{
  margin:0;
  font-family:'Inter',system-ui,sans-serif;
  background:var(--paper);
  color:var(--ink);
  font-size:14px;
  -webkit-font-smoothing:antialiased;
}
.mono{font-family:'IBM Plex Mono',ui-monospace,monospace;}
h1,h2,h3,.display{font-family:'Fraunces',serif;}
button{font-family:inherit;}
a{color:inherit;}
::selection{background:var(--amber);color:#fff;}

/* ---------- App shell ---------- */
#app{display:flex;min-height:100vh;}
.login-gate{position:fixed;inset:0;background:var(--teal-dark);display:flex;align-items:center;justify-content:center;z-index:9999;padding:20px;}
.login-card{background:#fff;border-radius:var(--radius);box-shadow:var(--shadow);padding:32px 28px;max-width:380px;width:100%;text-align:center;}
.login-card h1{font-family:'Fraunces',serif;font-size:22px;margin:0 0 4px;}
.login-card .sub{color:var(--ink-soft);font-size:13px;margin-bottom:22px;}
.login-card .field{text-align:left;}

.sidebar{
  width:212px;
  flex-shrink:0;
  background:var(--teal-dark);
  color:#EAF2F1;
  display:flex;
  flex-direction:column;
  padding:20px 14px;
}
.brand{
  font-family:'Fraunces',serif;
  font-weight:600;
  font-size:22px;
  color:#fff;
  letter-spacing:.2px;
  padding:0 8px 4px;
}
.brand small{display:block;font-family:'Inter',sans-serif;font-weight:500;font-size:10.5px;letter-spacing:1.5px;text-transform:uppercase;color:#9DBBB8;margin-top:2px;}
.nav{margin-top:28px;display:flex;flex-direction:column;gap:2px;}
.nav-item{
  display:flex;align-items:center;gap:10px;
  padding:10px 12px;border-radius:8px;
  color:#CFE3E1;text-decoration:none;cursor:pointer;
  font-weight:500;font-size:13.5px;
  border:none;background:transparent;text-align:left;width:100%;
  position:relative;
}
.nav-item:hover{background:rgba(255,255,255,0.06);color:#fff;}
.nav-item.active{background:#fff;color:var(--teal-dark);}
.nav-item .ic{width:18px;text-align:center;font-size:15px;}
.nav-badge{
  margin-left:auto;background:var(--amber);color:#fff;font-size:10.5px;font-weight:700;
  border-radius:20px;padding:1px 6px;min-width:16px;text-align:center;
}
.sidebar-foot{margin-top:auto;padding:10px 8px;color:#7FA19D;font-size:11px;line-height:1.5;}

.main{flex:1;display:flex;flex-direction:column;min-width:0;}
.topbar{
  display:flex;align-items:center;justify-content:space-between;
  padding:14px 28px;background:var(--surface);border-bottom:1px solid var(--border);
  gap:16px;flex-wrap:wrap;
}
.day-pill{
  display:flex;align-items:center;gap:8px;padding:7px 12px;border-radius:30px;
  font-size:12.5px;font-weight:600;
}
.day-pill.open{background:var(--green-tint);color:var(--green);}
.day-pill.closed{background:var(--red-tint);color:var(--red);}
.dot{width:7px;height:7px;border-radius:50%;background:currentColor;}
.topbar-right{display:flex;align-items:center;gap:10px;}
.mobile-return-home{display:none;}

.gtx-type-grid{display:grid;grid-template-columns:repeat(3,1fr);gap:10px;}
.gtx-type-tile{
  padding:18px 10px;border-radius:10px;border:2px solid var(--border);background:var(--surface);
  font-weight:800;font-size:16px;letter-spacing:.5px;cursor:pointer;color:var(--ink-soft);
}
.gtx-type-tile:hover{border-color:var(--teal);}
.gtx-type-tile.checked{border-color:var(--teal);background:var(--teal-tint);color:var(--teal-dark);}
.numpad-grid{display:grid;grid-template-columns:repeat(3,1fr);gap:8px;}
.numpad-key{font-size:20px;padding:16px 0;border-radius:8px;border:1.5px solid var(--border);background:var(--surface);cursor:pointer;font-weight:600;}
.numpad-key:hover{background:var(--teal-tint);border-color:var(--teal);}
.numpad-key:active{background:var(--teal);color:#fff;}

.home-grid{display:grid;grid-template-columns:repeat(2,1fr);gap:14px;max-width:520px;margin:0 auto;}
.home-tile{
  aspect-ratio:1/0.85;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:8px;
  background:var(--surface);border:1px solid var(--border);border-radius:var(--radius);box-shadow:var(--shadow);
  cursor:pointer;padding:10px;text-align:center;
}
.home-tile:hover{border-color:var(--teal);}
.home-tile .ic{font-size:34px;}
.home-tile .lbl{font-size:13px;font-weight:700;color:var(--ink);}
.home-tile .badge{position:static;margin-top:2px;}
/* Wider windows (desktop, tablets landscape): use 4 columns instead of 2 so all 8
   tiles fit in two short rows without needing to scroll, since there's plenty of
   horizontal room once the sidebar is hidden on the Home screen. */
@media (min-width: 640px){
  .home-grid{grid-template-columns:repeat(4,1fr);max-width:760px;gap:16px;}
  .home-tile{aspect-ratio:1/0.75;}
  .home-tile .ic{font-size:30px;}
}

.view{padding:24px 28px 60px;max-width:1400px;}
.view-title{display:flex;align-items:baseline;justify-content:space-between;gap:16px;margin-bottom:18px;flex-wrap:wrap;}
.view-title h1{font-size:24px;margin:0;font-weight:600;}
.view-title .sub{color:var(--ink-soft);font-size:13px;}

/* ---------- Buttons ---------- */
.btn{
  display:inline-flex;align-items:center;gap:6px;justify-content:center;
  padding:9px 16px;border-radius:8px;border:1px solid transparent;
  font-weight:600;font-size:13px;cursor:pointer;transition:filter .1s, background .15s;
  white-space:nowrap;
}
.btn:active{filter:brightness(0.95);}
.btn-primary{background:var(--teal);color:#fff;}
.btn-primary:hover{background:var(--teal-dark);}
.btn-amber{background:var(--amber);color:#fff;}
.btn-amber:hover{background:var(--amber-dark);}
.btn-ghost{background:transparent;color:var(--ink);border-color:var(--border);}
.btn-ghost:hover{background:var(--teal-tint);}
.btn-danger{background:transparent;color:var(--red);border-color:#EFCFCF;}
.btn-danger:hover{background:var(--red-tint);}
.btn-danger-solid{background:var(--red);color:#fff;border-color:var(--red);}
.btn-danger-solid:hover{background:#A83737;}
.btn-sm{padding:5px 10px;font-size:12px;border-radius:6px;}
.btn:disabled{opacity:.45;cursor:not-allowed;}
.btn-block{width:100%;}
.icon-btn{background:transparent;border:none;cursor:pointer;color:var(--ink-soft);padding:4px 6px;border-radius:6px;font-size:13px;}
.icon-btn:hover{background:var(--teal-tint);color:var(--teal-dark);}

/* ---------- Cards / tables ---------- */
.card{background:var(--surface);border:1px solid var(--border);border-radius:var(--radius);box-shadow:var(--shadow);}
.card-pad{padding:20px;}
.card-head{display:flex;align-items:center;justify-content:space-between;padding:16px 20px;border-bottom:1px solid var(--border);gap:10px;flex-wrap:wrap;}
.card-head h3{margin:0;font-size:15px;font-weight:600;}
.grid{display:grid;gap:18px;}
.grid-2{grid-template-columns:1.15fr .85fr;}
@media(max-width:980px){.grid-2{grid-template-columns:1fr;}}

table{width:100%;border-collapse:collapse;font-size:13px;}
thead th{
  text-align:left;font-size:11px;letter-spacing:.5px;text-transform:uppercase;
  color:var(--ink-soft);font-weight:600;padding:10px 20px;border-bottom:1px solid var(--border);
  background:#FBFAF6;
}
tbody td{padding:11px 20px;border-bottom:1px solid #EFEDE4;vertical-align:middle;}
tbody tr:last-child td{border-bottom:none;}
tbody tr:hover{background:#FBFAF6;}
.num{font-family:'IBM Plex Mono',monospace;text-align:right;}
.tbl-wrap{overflow-x:auto;}
.empty-row td{text-align:center;color:var(--ink-soft);padding:34px 20px;font-style:italic;}

.badge{display:inline-block;padding:2px 8px;border-radius:20px;font-size:11px;font-weight:700;letter-spacing:.2px;}
.badge-green{background:var(--green-tint);color:var(--green);}
.badge-amber{background:#FCF1DE;color:var(--amber-dark);}
.badge-red{background:var(--red-tint);color:var(--red);}
.badge-grey{background:#EFEDE4;color:var(--ink-soft);}
.badge-blue{background:#E7EEF7;color:#2B5FA8;}
.badge-teal{background:var(--teal-tint);color:var(--teal-dark);}

/* ---------- Forms ---------- */
label{display:block;font-size:12px;font-weight:600;color:var(--ink-soft);margin-bottom:5px;}
input,select,textarea{
  width:100%;padding:9px 11px;border:1px solid var(--border);border-radius:7px;
  font-size:13.5px;font-family:'Inter',sans-serif;background:#fff;color:var(--ink);
}
input:focus,select:focus,textarea:focus{outline:2px solid var(--teal);outline-offset:1px;border-color:var(--teal);}
.field{margin-bottom:14px;}
.field-row{display:grid;grid-template-columns:1fr 1fr;gap:12px;}
.margins-row{grid-template-columns:repeat(4,1fr);}
.hint{font-size:11.5px;color:var(--ink-soft);margin-top:4px;}
.radio-row{display:flex;gap:8px;flex-wrap:wrap;}
.radio-opt{
  flex:1;min-width:110px;border:1.5px solid var(--border);border-radius:8px;padding:10px 12px;cursor:pointer;
  display:flex;align-items:center;gap:8px;font-weight:600;font-size:13px;
}
.radio-opt input{width:auto;margin:0;}
.radio-opt.checked{border-color:var(--teal);background:var(--teal-tint);color:var(--teal-dark);}
.search-box{position:relative;}
.search-box input{padding-left:30px;}
.search-box:before{content:"⌕";position:absolute;left:10px;top:50%;transform:translateY(-50%);color:var(--ink-soft);font-size:15px;}
.ac-wrap{position:relative;}
.ac-list{position:absolute;z-index:20;top:calc(100% + 4px);left:0;right:0;background:#fff;border:1px solid var(--border);border-radius:8px;box-shadow:0 4px 14px rgba(0,0,0,.1);max-height:220px;overflow-y:auto;}
.ac-item{padding:8px 12px;cursor:pointer;font-size:13px;border-bottom:1px solid var(--border);}
.ac-item:last-child{border-bottom:none;}
.ac-item:hover,.ac-item.active{background:var(--teal-tint);}
.ac-item .ac-sub{font-size:11px;color:var(--ink-soft);margin-top:2px;}
.cust-chip{display:flex;align-items:center;justify-content:space-between;gap:8px;padding:9px 12px;border:1.5px solid var(--teal);border-radius:8px;background:var(--teal-tint);}
.cust-chip .name{font-weight:700;color:var(--teal-dark);font-size:13px;}
.cust-chip .sub{font-size:11.5px;color:var(--ink-soft);margin-top:2px;}
.vs-item-row:hover{background:var(--teal-tint);}
.vs-item-row.selected{background:var(--teal-tint);}

/* ---------- Tabs (subnav) ---------- */
.subtabs{display:flex;gap:4px;margin-bottom:16px;border-bottom:1px solid var(--border);}

/* ---------- Inventory dept/category tree ---------- */
.dept-group{padding:0;overflow:hidden;}
.dept-group-head{
  width:100%;display:flex;align-items:center;gap:10px;text-align:left;
  padding:14px 20px;background:var(--teal-tint);border:none;cursor:pointer;
  font-size:15px;font-weight:600;color:var(--teal-dark);
}
.dept-group-head:hover{background:#DEEAE8;}
.dept-group-body{padding:6px 0 4px;}
.cat-group{border-top:1px solid var(--border);}
.cat-group:first-child{border-top:none;}
.cat-group-head{
  width:100%;display:flex;align-items:center;gap:9px;text-align:left;
  padding:10px 20px 10px 40px;background:#fff;border:none;cursor:pointer;
  font-size:13px;font-weight:600;color:var(--ink);
}
.cat-group-head:hover{background:#FBFAF6;}
.tree-caret{color:var(--ink-soft);font-size:11px;width:10px;}
.tree-label{flex:1;}
.tree-count{font-size:11.5px;font-weight:500;color:var(--ink-soft);}
.subtab{padding:9px 16px;font-weight:600;font-size:13px;color:var(--ink-soft);cursor:pointer;border-bottom:2px solid transparent;background:none;border-top:none;border-left:none;border-right:none;}
.subtab.active{color:var(--teal-dark);border-color:var(--amber);}

/* ---------- Sales layout / receipt tape ---------- */
.sales-grid{display:grid;grid-template-columns:1.2fr .95fr;gap:20px;align-items:start;}
@media(max-width:1050px){.sales-grid{grid-template-columns:1fr;}}
.receipt-tape{
  background:#FFFDF8;
  border:1px solid var(--border);
  position:relative;
  box-shadow:var(--shadow);
  clip-path: polygon(
    0% 0%,100% 0%,100% 97%,
    96% 100%,92% 97%,88% 100%,84% 97%,80% 100%,76% 97%,72% 100%,68% 97%,64% 100%,60% 97%,56% 100%,52% 97%,48% 100%,44% 97%,40% 100%,36% 97%,32% 100%,28% 97%,24% 100%,20% 97%,16% 100%,12% 97%,8% 100%,4% 97%,0% 100%
  );
  padding-bottom:22px;
}
.receipt-head{padding:18px 20px 10px;text-align:center;border-bottom:1px dashed var(--border);}
.receipt-head .store{font-family:'Fraunces',serif;font-weight:600;font-size:17px;}
.receipt-head .meta{font-size:11px;color:var(--ink-soft);margin-top:2px;}
.cart-list{padding:6px 20px;min-height:70px;}
.cart-row{display:flex;justify-content:space-between;gap:8px;padding:9px 0;border-bottom:1px dashed #EEE9DB;font-size:13px;}
.cart-row:last-child{border-bottom:none;}
.cart-row .ci-name{font-weight:600;}
.cart-row .ci-sub{color:var(--ink-soft);font-size:11.5px;}
.cart-row .ci-right{text-align:right;font-family:'IBM Plex Mono',monospace;white-space:nowrap;}
.cart-qty-ctrl{display:flex;align-items:center;gap:6px;margin-top:3px;}
.cart-qty-ctrl button{width:20px;height:20px;border-radius:5px;border:1px solid var(--border);background:#fff;cursor:pointer;font-weight:700;line-height:1;}
.receipt-totals{padding:10px 20px 4px;border-top:1px dashed var(--border);margin-top:6px;}
.tot-row{display:flex;justify-content:space-between;padding:4px 0;font-size:13px;}
.tot-row.grand{font-size:17px;font-weight:700;font-family:'IBM Plex Mono',monospace;border-top:1px dashed var(--border);margin-top:6px;padding-top:10px;}
.receipt-empty{text-align:center;color:var(--ink-soft);font-style:italic;padding:30px 10px;}

/* ---------- Modal ---------- */
.overlay{position:fixed;inset:0;background:rgba(20,30,32,0.42);display:flex;align-items:flex-start;justify-content:center;padding:20px 16px;overflow:auto;z-index:100;}
.modal{background:#fff;border-radius:12px;width:100%;max-width:520px;box-shadow:0 20px 60px rgba(0,0,0,0.25);}
.modal-head{display:flex;justify-content:space-between;align-items:center;padding:18px 22px;border-bottom:1px solid var(--border);}
.modal-head h3{margin:0;font-size:16px;}
.modal-body{padding:20px 22px;max-height:65vh;overflow:auto;}
.modal-foot{padding:16px 22px;border-top:1px solid var(--border);display:flex;justify-content:flex-end;gap:10px;}
.close-x{background:none;border:none;font-size:18px;cursor:pointer;color:var(--ink-soft);}

/* ---------- Toast ---------- */
#toast-host{position:fixed;bottom:20px;right:20px;z-index:200;display:flex;flex-direction:column;gap:8px;}
.toast{background:var(--teal-dark);color:#fff;padding:11px 16px;border-radius:8px;font-size:13px;font-weight:500;box-shadow:var(--shadow);animation:toastin .18s ease-out;}
.toast.err{background:var(--red);}
.toast.ok{background:var(--green);}
@keyframes toastin{from{opacity:0;transform:translateY(6px);}to{opacity:1;transform:translateY(0);}}

.stat-cards{display:grid;grid-template-columns:repeat(auto-fit,minmax(160px,1fr));gap:14px;margin-bottom:20px;}
.stat-card{background:#fff;border:1px solid var(--border);border-radius:10px;padding:16px 18px;}
.stat-card .lbl{font-size:11px;text-transform:uppercase;letter-spacing:.4px;color:var(--ink-soft);font-weight:700;}
.stat-card .val{font-family:'IBM Plex Mono',monospace;font-size:22px;font-weight:600;margin-top:6px;}

.pill-btn-group{display:flex;border:1px solid var(--border);border-radius:8px;overflow:hidden;}
.pill-btn-group button{border:none;background:#fff;padding:8px 14px;font-size:12.5px;font-weight:600;cursor:pointer;color:var(--ink-soft);}
.pill-btn-group button.active{background:var(--teal);color:#fff;}

.link-btn{background:none;border:none;color:var(--teal);font-weight:600;cursor:pointer;padding:0;font-size:12.5px;text-decoration:underline;}

/* print receipt */
#print-area{display:none;}
@media print{
  #app,#toast-host,.overlay{display:none !important;}
  #print-area{display:block !important;}
}
/* .receipt-doc is the same layout used for #print-area (the actual printed page) and for
   on-screen receipt preview modals — so a preview always looks exactly like what will print. */
#print-area, .receipt-doc{width:300px;font-family:'IBM Plex Mono',monospace;font-size:13.5px;font-weight:600;}
#print-area h2, .receipt-doc h2{font-family:'Fraunces',serif;text-align:center;margin:0 0 2px;}
#print-area .pctr, .receipt-doc .pctr{text-align:center;}
#print-area hr, .receipt-doc hr{border:none;border-top:1px dashed #000;margin:8px 0;}
#print-area .prow, .receipt-doc .prow{display:flex;justify-content:space-between;gap:10px;}
#print-area .prow span, .receipt-doc .prow span{overflow-wrap:break-word;}
#print-area .prow span:first-child, .receipt-doc .prow span:first-child{flex-shrink:0;}
#print-area .prow span:last-child, .receipt-doc .prow span:last-child{text-align:right;min-width:0;}
.receipt-doc{width:auto;background:#FFFDF8;border:1px solid var(--border);border-radius:8px;padding:16px 18px;}
.receipt-doc .receipt-no-big{font-size:15px;font-weight:700;}

.scrollx{overflow-x:auto;}
.footer-note{color:var(--ink-soft);font-size:11.5px;margin-top:10px;}

/* ============================================================
   MOBILE RESPONSIVE
============================================================ */
@media (max-width: 860px){
  #app{flex-direction:column;min-height:auto;}

  .sidebar{
    width:100%;flex-shrink:0;flex-direction:row;align-items:center;
    padding:8px 10px;gap:0;position:sticky;top:0;z-index:50;
  }
  .brand{display:none;}
  .nav{
    margin-top:0;flex-direction:row;gap:2px;flex-wrap:nowrap;
    overflow-x:auto;-webkit-overflow-scrolling:touch;width:100%;
  }
  .nav-item{
    flex-direction:column;gap:2px;padding:7px 10px;font-size:10px;
    white-space:nowrap;flex-shrink:0;
  }
  .nav-item .ic{font-size:17px;width:auto;}
  .nav-badge{position:absolute;top:2px;right:2px;margin-left:0;}
  .sidebar-foot{display:none;}

  .topbar{padding:10px 14px;gap:8px;}
  .topbar-right{gap:6px;}
  .mobile-return-home{display:block;padding:10px 12px 20px;}
  .view{padding:14px 12px 60px;}
  .view-title{flex-direction:column;align-items:flex-start;gap:4px;margin-bottom:14px;}
  .view-title h1{font-size:19px;}

  .sales-grid{grid-template-columns:1fr;gap:14px;}
  .grid{gap:12px;}
  .field-row{grid-template-columns:1fr;gap:0;}
  .field-row .field{margin-bottom:14px;}
  .margins-row{grid-template-columns:repeat(2,1fr);gap:12px;}
  .margins-row .field{margin-bottom:12px;}
  .stat-cards{grid-template-columns:repeat(2,1fr);gap:10px;margin-bottom:16px;}
  .stat-card{padding:12px 14px;}
  .stat-card .val{font-size:18px;}

  .card-pad{padding:14px;}
  .card-head{padding:12px 14px;}
  thead th{padding:8px 10px;font-size:10px;}
  tbody td{padding:9px 10px;font-size:12.5px;}

  .btn{padding:10px 14px;font-size:13px;}
  .btn-sm{padding:7px 10px;font-size:11.5px;}

  .overlay{padding:0;align-items:stretch;}
  .modal{max-width:100% !important;width:100%;min-height:100vh;border-radius:0;display:flex;flex-direction:column;}
  .modal-body{max-height:none !important;flex:1;}
  .modal-foot{position:sticky;bottom:0;background:#fff;}

  /* Prevent iOS Safari from auto-zooming when a field is focused */
  input,select,textarea{font-size:16px;}
}

@media (max-width: 480px){
  .stat-cards{grid-template-columns:repeat(2,1fr);}
  .nav-item span:not(.ic){font-size:9px;}

/* ---------------- toast ---------------- */
function toast(msg, kind){
  const host = document.getElementById('toast-host');
  const el = document.createElement('div');
  el.className = 'toast' + (kind==='err'?' err':kind==='ok'?' ok':'');
  el.textContent = msg;
  host.appendChild(el);
  setTimeout(()=>{ el.style.opacity='0'; el.style.transition='opacity .3s'; setTimeout(()=>el.remove(),300); }, 2600);
}

/* ---------------- modal ---------------- */
function openModal(title, bodyHTML, footHTML, opts){
  opts = opts || {};
  closeModal();
  const ov = document.createElement('div');
  ov.className = 'overlay';
  ov.id = 'active-modal';
  const modalStyle = opts.maxWidth ? ` style="max-width:${opts.maxWidth};"` : '';
  const bodyStyle = opts.tallBody ? ` style="max-height:88vh;"` : '';
  ov.innerHTML = `<div class="modal"${modalStyle}>
    <div class="modal-head"><h3>${title}</h3><button class="close-x" data-action="close-modal">&times;</button></div>
    <div class="modal-body"${bodyStyle}>${bodyHTML}</div>
    ${footHTML? `<div class="modal-foot">${footHTML}</div>` : ''}
  </div>`;
  ov.addEventListener('mousedown', (e)=>{ if(e.target===ov) closeModal(); });
  document.body.appendChild(ov);
}
function closeModal(){ const m = document.getElementById('active-modal'); if(m) m.remove(); }

/* ============================================================
   CAMERA BARCODE SCANNING — for phones/devices with no physical
   scanner attached. Uses the device camera + ZXing to decode
   barcodes from the live video feed.
============================================================ */
let cameraScanReader = null;
let cameraScanStream = null;

function stopCameraScan(){
  if(cameraScanReader){ try{ cameraScanReader.reset(); }catch(e){} cameraScanReader = null; }
  if(cameraScanStream){ try{ cameraScanStream.getTracks().forEach(t=>t.stop()); }catch(e){} cameraScanStream = null; }
}

function openCameraScanModal(onResult){
  if(typeof ZXing === 'undefined'){ toast('Camera scanning library did not load — check your internet connection.','err'); return; }
  if(!navigator.mediaDevices || !navigator.mediaDevices.getUserMedia){ toast('This browser/device does not support camera access.','err'); return; }

  openModal('Scan Barcode', `
    <div style="position:relative;background:#000;border-radius:8px;overflow:hidden;aspect-ratio:4/3;">
      <video id="cam-scan-video" style="width:100%;height:100%;object-fit:cover;" playsinline muted autoplay></video>
    </div>
    <div id="cam-scan-status" class="hint" style="text-align:center;margin-top:10px;">Point the camera at a barcode…</div>
  `, `<button class="btn btn-ghost" data-action="close-modal">Cancel</button>`);

  const statusEl = document.getElementById('cam-scan-status');
  const videoEl = document.getElementById('cam-scan-video');
  cameraScanReader = new ZXing.BrowserMultiFormatReader();

  cameraScanReader.decodeFromConstraints(
    { video: { facingMode: 'environment' } },
    videoEl,
    (result, err)=>{
      if(result){
        const text = result.getText();
        stopCameraScan();
        closeModal();
        onResult(text);
      }
      // NotFoundException fires continuously while no barcode is in frame — ignore it, that's normal.
    }
  ).then(controls=>{
    cameraScanStream = videoEl.srcObject;
  }).catch(e=>{
    statusEl.textContent = 'Could not access the camera: ' + (e.message||e);
    statusEl.style.color = 'var(--red)';
  });

  // Make sure the camera is released if the modal is closed any other way (Cancel, Escape, backdrop click).
  const observer = new MutationObserver(()=>{
    if(!document.getElementById('cam-scan-video')){ stopCameraScan(); observer.disconnect(); }
  });
  observer.observe(document.body, {childList:true, subtree:true});
}


/* ============================================================
   PASSCODE AUTHORIZATION
============================================================ */
function logSecurityEvent(action, user, success){
  if(!state.securityLogs) state.securityLogs = [];
  state.securityLogs.push({
    id: uid('sec'), date: Date.now(), action,
    userId: user? user.id : null, userName: user? user.name : (state.users.length? 'Unknown user':'No users set up'),
    success
  });
  save();
}

function requireAuth(actionLabel, onSuccess){
  if(!state.users || !state.users.length){
    toast('Add at least one user with a passcode in Settings before this action can be authorized.','err');
    return;
  }
  openModal('Passcode Required', `
    <div class="hint" style="margin-bottom:12px;">Authorization needed for: <strong>${esc(actionLabel)}</strong></div>
    <div class="field">
      <label>Scan ID barcode, or type your passcode</label>
      <input type="password" id="m-auth-input" placeholder="Scan barcode or type passcode" autocomplete="off">
      <div class="hint">Scanning a barcode authorizes instantly. Typing your passcode automatically finds your account — no need to pick a name first.</div>
    </div>
    <div id="m-auth-err" class="hint" style="color:var(--red);display:none;">Not recognized. Try again.</div>
  `, `<button class="btn btn-ghost" data-action="close-modal">Cancel</button><button class="btn btn-primary" id="m-auth-confirm">Confirm</button>`);

  const inp = document.getElementById('m-auth-input');
  const errEl = document.getElementById('m-auth-err');
  inp.focus();

  const attempt = ()=>{
    const val = inp.value.trim();
    if(!val){ toast('Scan a barcode or type a passcode.','err'); return; }

    // Barcode scan match — identifies and authorizes instantly, no separate passcode step.
    let user = state.users.find(u=> u.barcode && u.barcode === val);
    // Otherwise treat the input as a typed passcode and find whichever user it belongs to.
    if(!user) user = state.users.find(u=> u.passcode === val);

    if(!user){
      errEl.style.display = 'block';
      inp.value = '';
      inp.focus();
      logSecurityEvent(actionLabel, null, false);
      return;
    }
    logSecurityEvent(actionLabel, user, true);
    closeModal();
    onSuccess(user);
  };

  inp.addEventListener('keydown', (e)=>{ if(e.key==='Enter'){ e.preventDefault(); attempt(); } });
  document.getElementById('m-auth-confirm').addEventListener('click', attempt);
}

function openUserModal(id){
  const user = id ? state.users.find(u=>u.id===id) : null;
  openModal(user? 'Edit User' : 'Add User', `
    <div class="field"><label>Name</label><input id="m-uname" value="${user?esc(user.name):''}" placeholder="e.g. Maria Santos"></div>
    <div class="field"><label>ID barcode (optional)</label><input id="m-ubarcode" value="${user?esc(user.barcode||''):''}" placeholder="Scan or type an ID barcode" autocomplete="off"></div>
    <div class="field"><label>Passcode</label><input type="password" inputmode="numeric" id="m-ucode" placeholder="${user?'Leave blank to keep current passcode':'4+ digit passcode'}" autocomplete="off"></div>
    <div class="field"><label>Confirm passcode</label><input type="password" inputmode="numeric" id="m-ucode2" placeholder="Re-enter passcode" autocomplete="off"></div>
    <div class="hint">This is a basic PIN check to record who authorized each action — not full account security. Anyone with access to this device can still open Settings.</div>
  `, `<button class="btn btn-ghost" data-action="close-modal">Cancel</button><button class="btn btn-primary" id="m-usave">Save</button>`);

  document.getElementById('m-usave').addEventListener('click', ()=>{
    const name = document.getElementById('m-uname').value.trim();
    const barcode = document.getElementById('m-ubarcode').value.trim();
    const code = document.getElementById('m-ucode').value;
    const code2 = document.getElementById('m-ucode2').value;
    if(!name){ toast('Enter a name.','err'); return; }
    if(!user && !code){ toast('Enter a passcode.','err'); return; }
    if(code && code.length<4){ toast('Passcode must be at least 4 digits/characters.','err'); return; }
    if(code && code !== code2){ toast('Passcodes do not match.','err'); return; }
    if(barcode){
      const dupe = state.users.find(u=>u.barcode && u.barcode===barcode && (!user || u.id!==user.id));
      if(dupe){ toast(`That barcode is already assigned to ${dupe.name}.`,'err'); return; }
    }
    if(user){
      user.name = name;
      user.barcode = barcode;
      if(code) user.passcode = code;
    } else {
      state.users.push({id:uid('usr'), name, barcode, passcode:code, createdAt:Date.now()});
    }
    save(); closeModal(); renderView(); toast('User saved.','ok');
  });
}

function getDept(id){ return state.departments.find(d=>d.id===id); }
function getCat(id){ return state.categories.find(c=>c.id===id); }
function getProd(id){ return state.products.find(p=>p.id===id); }
function getCust(id){ return state.customers.find(c=>c.id===id); }
function getProdByBarcode(code){ code=(code||'').trim(); if(!code) return null; return state.products.find(p=>p.barcode && p.barcode.trim()===code); }
function getCustByBarcode(code){ code=(code||'').trim(); if(!code) return null; return state.customers.find(c=>c.barcode && c.barcode.trim()===code); }
function catsForDept(deptId){ return state.categories.filter(c=>c.departmentId===deptId); }
function prodsForCat(catId){ return state.products.filter(p=>p.categoryId===catId); }
function custSaleTotal(custId){
  return state.sales.filter(s=>s.customerId===custId && !s.voided).reduce((a,s)=>a+s.total,0);
}
function awardRewardsPoints(customerId, amount, note){
  const rs = state.meta.rewardsSettings || {};
  if(!rs.enabled || !customerId) return 0;
  const rate = Number(rs.amountPerPoint)||100;
  const pts = Math.floor((Number(amount)||0) / rate);
  if(pts<=0) return 0;
  const cust = getCust(customerId);
  if(!cust) return 0;
  cust.points = (cust.points||0) + pts;
  if(!state.rewardsLog) state.rewardsLog = [];
  state.rewardsLog.push({id:uid('rwd'), date:Date.now(), customerId, customerName:cust.name, points:pts, type:'earned', note:note||''});
  return pts;
}

function custLayawayBalance(custId){
  return state.layaways.filter(l=>l.customerId===custId && l.status==='active').reduce((a,l)=>a+l.balance,0);
}

function attachCustomerToCart(cust){
  state.cart.customerId = cust.id;
  save(); renderView();
  toast(`Customer attached: ${cust.name}`,'ok');
  maybeShowCustomerAlert(cust);
}

function maybeShowCustomerAlert(cust){
  const balance = custLayawayBalance(cust.id);
  const notes = (cust.notes||'').trim();
  if(balance<=0 && !notes) return; // nothing important to flag — skip the popup
  const activeCount = state.layaways.filter(l=>l.customerId===cust.id && l.status==='active').length;
  openModal(`Heads up — ${esc(cust.name)}`, `
    ${balance>0 ? `
      <div class="hint" style="margin-bottom:14px;background:var(--red-tint);padding:10px 12px;border-radius:8px;color:var(--red);">
        <strong>Outstanding lay-away balance: ${fmt(balance)}</strong>${activeCount>1? ` (${activeCount} active orders)` : ''}

function bindShellEvents(){

function cartSubtotal(){ return state.cart.items.reduce((a,i)=>a+i.qty*i.price,0); }
function cartTax(){ return round2(cartSubtotal() * (Number(state.meta.taxRate)||0)/100 - (state.cart.discount>0? (Number(state.meta.taxRate)||0)/100*Math.min(state.cart.discount, cartSubtotal()):0)); }
function round2(n){ return Math.round(n*100)/100; }
function cartTotal(){
  const sub = cartSubtotal();
  const disc = Math.min(Number(state.cart.discount)||0, sub);
  const taxable = sub - disc;
  const tax = round2(taxable * (Number(state.meta.taxRate)||0)/100);
  return round2(taxable + tax);
}

function addProductToCart(pid, qty){
  qty = Math.max(1, parseInt(qty)||1);
  const prod = getProd(pid);
  if(!prod){ toast('Product not found.','err'); return; }
  const existing = state.cart.items.find(i=>i.productId===pid);
  const alreadyInCart = existing? existing.qty : 0;
  if(!prod.nonInventory && alreadyInCart + qty > prod.stock){
    toast(`Only ${prod.stock} in stock for ${prod.name}.`,'err'); return;
  }
  if(existing){ existing.qty += qty; }
  else{ state.cart.items.push({productId:pid, name:prod.name, price:prod.price, qty}); }
  save(); renderView();
}

function openQuantityModal(prod){
  const existing = state.cart.items.find(i=>i.productId===prod.id);
  const alreadyInCart = existing? existing.qty : 0;
  const maxQty = prod.nonInventory ? Infinity : Math.max(1, prod.stock - alreadyInCart);
  openModal(`Add "${esc(prod.name)}"`, `
    <p class="hint">Price: <strong class="mono">${fmt(prod.price)}</strong> &middot; ${prod.nonInventory? '<strong>Unlimited</strong> (non-inventory item)' : `In stock: <strong>${prod.stock}</strong>${alreadyInCart? ` (${alreadyInCart} already in cart)`:''}`}</p>
    <div class="field"><label>Quantity</label><input type="number" id="m-qty" min="1" step="1" ${prod.nonInventory?'':`max="${prod.stock - alreadyInCart}"`} value="1"></div>
  `, `<button class="btn btn-ghost" data-action="close-modal">Cancel</button><button class="btn btn-primary" id="m-add">Add to Cart</button>`);

  const qtyInp = document.getElementById('m-qty');
  qtyInp.focus(); qtyInp.select();

  const confirmAdd = ()=>{
    const qty = Math.max(1, parseInt(qtyInp.value)||1);
    if(qty > maxQty){ toast(`Only ${maxQty} more available for ${prod.name}.`,'err'); return; }
    addProductToCart(prod.id, qty);
    closeModal();
    const scan = document.getElementById('f-barcode-scan');
    if(scan) scan.focus();
  };

  document.getElementById('m-add').addEventListener('click', confirmAdd);
  qtyInp.addEventListener('keydown', (e)=>{ if(e.key==='Enter'){ e.preventDefault(); confirmAdd(); } });
}

function openScanAddProductModal(code, qty){
  qty = Math.max(1, parseInt(qty)||1);
  const dept0 = state.departments[0]?.id || '';
  const buildDeptOptions = (selectedId)=>{
    const opts = state.departments.map(d=>`<option value="${d.id}" ${selectedId===d.id?'selected':''}>${esc(d.name)}</option>`).join('');
    return opts + `<option value="__new__">+ Add new department…</option>`;
  };
  const buildCatOptions = (deptId, selectedId)=>{
    const cats = catsForDept(deptId);
    const opts = cats.map(c=>`<option value="${c.id}" ${selectedId===c.id?'selected':''}>${esc(c.name)}</option>`).join('');
    return opts + `<option value="__new__">+ Add new category…</option>`;
  };

  openModal('Item Not Found — Add to Inventory?', `
    <div class="hint" style="margin-bottom:12px;">No product matches barcode <strong class="mono">"${esc(code)}"</strong>. Add it to inventory now to continue this sale.</div>
    <div class="field"><label>Product name</label><input id="m-name" placeholder="e.g. Bottled Water 500ml"></div>
    <div class="field-row">
      <div class="field">
        <label>Scan barcode</label>
        <input id="m-barcode" value="${esc(code)}" placeholder="Scan or type the barcode" autocomplete="off">
      </div>
      <div class="field">
        <label>Department</label>
        <select id="m-dept">${buildDeptOptions(dept0)}</select>
        <div id="m-dept-new-wrap" style="display:none;margin-top:6px;">
          <div class="field-row">
            <input id="m-dept-new" placeholder="New department name" style="flex:1;">
            <button type="button" class="btn btn-primary btn-sm" id="m-dept-new-add">Add</button>
          </div>
        </div>
      </div>
    </div>
    <div class="field">
      <label>Category</label>
      <select id="m-cat">${buildCatOptions(dept0, null)}</select>
      <div id="m-cat-new-wrap" style="display:none;margin-top:6px;">
        <div class="field-row">
          <input id="m-cat-new" placeholder="New category name" style="flex:1;">
          <button type="button" class="btn btn-primary btn-sm" id="m-cat-new-add">Add</button>
        </div>
      </div>
    </div>
    <div class="field-row">
      <div class="field"><label>Selling price (₱)</label><input id="m-price" type="number" min="0" step="0.01" placeholder="0.00"></div>
      <div class="field"><label>Cost price (₱)</label><input id="m-cost" type="number" min="0" step="0.01" placeholder="0.00"></div>
    </div>
    <div class="field-row">
      <div class="field"><label>Starting stock</label><input id="m-stock" type="number" min="0" step="1" value="${qty}"></div>
      <div class="field"><label>Reorder level</label><input id="m-reorder" type="number" min="0" step="1" value="5"></div>
    </div>
    <div class="hint">Starting stock defaults to the quantity being sold now (${qty}). Adjust if you're receiving more than this sale needs.</div>
  `, `<button class="btn btn-ghost" data-action="close-modal">Cancel (skip this item)</button><button class="btn btn-primary" id="m-save">Add to Inventory &amp; Continue Sale</button>`);

  const deptSel = document.getElementById('m-dept');
  const catSel = document.getElementById('m-cat');
  const deptNewWrap = document.getElementById('m-dept-new-wrap');
  const catNewWrap = document.getElementById('m-cat-new-wrap');
  const deptNewInp = document.getElementById('m-dept-new');
  const catNewInp = document.getElementById('m-cat-new');
  const barcodeInp = document.getElementById('m-barcode');
  const nameInp = document.getElementById('m-name');

  barcodeInp.addEventListener('keydown', (e)=>{
    if(e.key!=='Enter') return;
    e.preventDefault();
    const val = barcodeInp.value.trim();
    if(!val){ toast('Enter or scan a barcode.','err'); return; }
    const dupe = state.products.find(p=>p.barcode===val);
    if(dupe){ toast(`Barcode already used by "${dupe.name}". Scan a different item.`,'err'); barcodeInp.select(); return; }
    nameInp.focus();
  });
  barcodeInp.select();

  if(!state.departments.length){ deptNewWrap.style.display='block'; }
  if(catSel.value === '__new__'){ catNewWrap.style.display='block'; }

  deptSel.addEventListener('change', ()=>{
    if(deptSel.value === '__new__'){
      deptNewWrap.style.display='block';
      deptNewInp.focus();
    } else {
      deptNewWrap.style.display='none';
      catSel.innerHTML = buildCatOptions(deptSel.value, null);
      catNewWrap.style.display = catSel.value==='__new__' ? 'block' : 'none';
    }
  });

  document.getElementById('m-dept-new-add').addEventListener('click', ()=>{
    const name = deptNewInp.value.trim();
    if(!name){ toast('Enter a department name.','err'); return; }
    const newDept = {id:uid('dep'), name};
    state.departments.push(newDept);
    save();
    deptSel.innerHTML = buildDeptOptions(newDept.id);
    deptNewWrap.style.display='none';
    deptNewInp.value='';
    catSel.innerHTML = buildCatOptions(newDept.id, null);
    // A brand-new department has no categories yet, so the category select's only
    // option is "+ Add new category…" — show the inline input right away instead
    // of leaving it hidden until the user re-triggers a change event.
    catNewWrap.style.display = catSel.value==='__new__' ? 'block' : 'none';
    toast('Department added.','ok');
  });

  catSel.addEventListener('change', ()=>{
    if(catSel.value === '__new__'){
      catNewWrap.style.display='block';
      catNewInp.focus();
    } else {
      catNewWrap.style.display='none';
    }
  });

  document.getElementById('m-cat-new-add').addEventListener('click', ()=>{
    const name = catNewInp.value.trim();
    const departmentId = deptSel.value;
    if(departmentId === '__new__' || !departmentId){ toast('Add the department first.','err'); return; }
    if(!name){ toast('Enter a category name.','err'); return; }
    const newCat = {id:uid('cat'), name, departmentId};
    state.categories.push(newCat);
    save();
    catSel.innerHTML = buildCatOptions(departmentId, newCat.id);
    catNewWrap.style.display='none';
    catNewInp.value='';
    toast('Category added.','ok');
  });

  document.getElementById('m-save').addEventListener('click', ()=>{
    const name = document.getElementById('m-name').value.trim();
    const barcode = document.getElementById('m-barcode').value.trim();
    const departmentId = deptSel.value;
    const categoryId = catSel.value;
    const price = Number(document.getElementById('m-price').value)||0;
    const cost = Number(document.getElementById('m-cost').value)||0;
    const stock = Math.max(0, Number(document.getElementById('m-stock').value)||0);
    const reorderLevel = Number(document.getElementById('m-reorder').value)||0;
    if(!name || !barcode){ toast('Enter a name and barcode.','err'); return; }
    const dupe = state.products.find(p=>p.barcode===barcode);
    if(dupe){ toast(`Barcode already used by "${dupe.name}".`,'err'); return; }
    if(!departmentId || departmentId==='__new__'){ toast('Choose or finish adding a department.','err'); return; }
    if(!categoryId || categoryId==='__new__'){ toast('Choose or finish adding a category.','err'); return; }
    const newProd = {id:uid('prd'), name, barcode, departmentId, categoryId, price, cost, stock, reorderLevel};
    state.products.push(newProd);
    save();
    closeModal();
    addProductToCart(newProd.id, Math.min(qty, stock));
    toast(`"${name}" added to inventory and to the sale.`,'ok');
    const fresh = document.getElementById('f-barcode-scan');
    if(fresh) fresh.focus();
  });
}
