    </div>`;
  }).join('') : `<div class="receipt-empty">Cart is empty.<br>Pick a product to begin a sale.</div>`;

  const sub = cartSubtotal(), disc = Math.min(Number(state.cart.discount)||0, sub), tax = round2((sub-disc)*(Number(state.meta.taxRate)||0)/100), total = cartTotal();

  return `
  ${!dayOpen ? `<div class="card card-pad" style="margin-bottom:16px;background:var(--red-tint);border-color:#EFCFCF;"><strong>Day is closed.</strong> Open the day from the top bar or Reports tab before ringing up sales.</div>` : ''}
  <div class="view-title"><h1>New Sale</h1><div class="sub">${state.cart.items.length} item(s) in cart</div></div>
  <div class="sales-grid">
    <div class="card card-pad">
      <div class="field">
        <label>Search Item</label>
        <div style="display:flex;gap:8px;">
          <div class="ac-wrap" style="flex:1;">
            <input type="text" id="f-barcode-scan" placeholder="Scan barcode or type a product name" ${!dayOpen?'disabled':''} autocomplete="off">
            <div id="f-item-results" class="ac-list" style="display:none;"></div>
          </div>
          <button type="button" class="btn btn-ghost" id="f-camera-scan" ${!dayOpen?'disabled':''} title="Scan with camera" style="flex-shrink:0;">📷 Scan</button>
        </div>
        <div class="hint">Scan a barcode, or type a name to search. On a phone with no scanner attached, tap "📷 Scan" to use the camera instead. You'll be asked for the quantity, then it's added to the cart.</div>
      </div>
      <hr style="border:none;border-top:1px solid var(--border);margin:16px 0;">
      <div class="field">
        <label>Customer</label>
        ${selectedCust ? `
          <div class="cust-chip">
            <div>
              <div class="name">${esc(selectedCust.name)}</div>
              <div class="sub">${esc(selectedCust.phone || selectedCust.barcode || 'No phone on file')}</div>
            </div>
            <button type="button" class="icon-btn" data-action="clear-customer">Remove</button>
          </div>
        ` : `
          <div class="ac-wrap">
            <input type="text" id="f-customer-search" placeholder="Scan barcode, or type name/phone to search" ${!dayOpen?'disabled':''} autocomplete="off">
            <div id="f-customer-results" class="ac-list" style="display:none;"></div>
          </div>
          <div class="hint">Leave blank for Walk-in / No customer.</div>
        `}
      </div>
      <div class="hint">Discount and payment method (Cash / Lay-away / Split) are set when you click "Complete Sale".</div>
    </div>

    <div class="receipt-tape">
      <div class="receipt-head">
        <div class="store display">${esc(state.meta.businessName)}</div>
        ${state.meta.businessAddress? `<div class="meta">${esc(state.meta.businessAddress)}</div>`:''}
        ${state.meta.businessContact? `<div class="meta">${esc(state.meta.businessContact)}</div>`:''}
        <div class="meta">${nowTimeStr()}</div>
      </div>
      <div class="cart-list">${cartRows}</div>
      <div class="receipt-totals">
        <div class="tot-row"><span>Subtotal</span><span class="mono">${fmt(sub)}</span></div>
        <div class="tot-row"><span>Discount</span><span class="mono">-${fmt(disc)}</span></div>
        ${Number(state.meta.taxRate)>0 ? `<div class="tot-row"><span>Tax (${state.meta.taxRate}%)</span><span class="mono">${fmt(tax)}</span></div>` : ''}
        <div class="tot-row grand"><span>Total</span><span>${fmt(total)}</span></div>
      </div>
      <div style="padding:14px 20px 0;display:flex;gap:8px;">
        <button class="btn btn-ghost" data-action="clear-cart" style="flex:1;">Clear <span style="opacity:.7;font-weight:500;">(Esc)</span></button>
        <button class="btn btn-amber" data-action="complete-sale" style="flex:2;" ${!dayOpen || !state.cart.items.length?'disabled':''}>Complete Sale <span style="opacity:.7;font-weight:500;">(F10)</span></button>
      </div>
    </div>
  </div>
  ${dayOpen && todaysCashAdjustments().length ? `
  <div class="card card-pad" style="margin-top:18px;">
    <h3 style="margin-top:0;">Today's Store Cash Adjustments</h3>
    <div class="tbl-wrap"><table>
      <thead><tr><th>Time</th><th>Type</th><th>Amount</th><th>Reason</th><th></th></tr></thead>
      <tbody>
        ${todaysCashAdjustments().slice().reverse().map(a=>`
          <tr>
            <td>${new Date(a.date).toLocaleTimeString('en-PH')}</td>
            <td>${a.type==='add'? '<span class="badge badge-green">Income</span>' : '<span class="badge badge-red">Expense</span>'}</td>
            <td class="num">${fmt(a.amount)}</td>
            <td>${esc(a.reason||'—')}</td>
            <td><button class="icon-btn" data-action="delete-cash-adjust" data-id="${a.id}">Delete</button></td>
          </tr>`).join('')}
      </tbody>
    </table></div>
  </div>
  ` : ''}
  `;
}

function bindSalesEvents(){
  const qs = (s)=>document.querySelector(s);

  const scanInp = qs('#f-barcode-scan');
  const itemResultsBox = qs('#f-item-results');
  if(scanInp && itemResultsBox){
    const pickItem = (prod)=>{
      scanInp.value = '';
      itemResultsBox.style.display = 'none';
      if(!prod.nonInventory && prod.stock <= 0){ toast(`${prod.name} is out of stock.`,'err'); return; }
      openQuantityModal(prod);
    };

    const renderItemResults = (query)=>{
      const q = query.trim().toLowerCase();
      if(!q){ itemResultsBox.style.display='none'; itemResultsBox.innerHTML=''; return; }
      const matches = state.products.filter(p=>
        p.name.toLowerCase().includes(q) || (p.barcode||'').toLowerCase().includes(q)
      ).slice(0,8);
      if(!matches.length){
        itemResultsBox.innerHTML = `<div class="ac-item" style="cursor:default;color:var(--ink-soft);">No matching items</div>`;
        itemResultsBox.style.display='block';
        return;
      }
      itemResultsBox.innerHTML = matches.map(p=>{
        const oos = !p.nonInventory && p.stock<=0;
        return `<div class="ac-item" data-id="${p.id}" style="${oos?'opacity:.55;':''}">
          <div>${esc(p.name)}${oos?' (out of stock)':''}${p.nonInventory?' <span class="badge badge-blue" style="font-size:9px;">SERVICE</span>':''}</div>
          <div class="ac-sub">${fmt(p.price)} · ${p.nonInventory? 'Unlimited' : 'stock '+p.stock}${p.barcode? ' · '+esc(p.barcode):''}</div>
        </div>`;
      }).join('');
      itemResultsBox.style.display='block';
      itemResultsBox.querySelectorAll('.ac-item[data-id]').forEach(el=>{
        el.addEventListener('click', ()=>{
          const prod = getProd(el.dataset.id);
          if(prod) pickItem(prod);
        });
      });
    };

    scanInp.addEventListener('input', ()=> renderItemResults(scanInp.value));
    scanInp.addEventListener('focus', ()=> { if(scanInp.value.trim()) renderItemResults(scanInp.value); });
    scanInp.addEventListener('blur', ()=>{ setTimeout(()=>{ itemResultsBox.style.display='none'; }, 150); });

    const submitItemSearch = (val)=>{
      val = (val||'').trim();
      if(!val) return;

      const byBarcode = getProdByBarcode(val);
      if(byBarcode){ pickItem(byBarcode); return; }

      const nameMatches = state.products.filter(p=> p.name.toLowerCase().includes(val.toLowerCase()));
      if(nameMatches.length===1){ pickItem(nameMatches[0]); return; }
      if(nameMatches.length>1){ toast('Multiple matches — pick one from the list below.','err'); return; }

      // No barcode or name match at all — treat it as a new/unknown barcode.
      scanInp.value='';
      itemResultsBox.style.display='none';
      openScanAddProductModal(val, 1);
    };

    scanInp.addEventListener('keydown', (e)=>{
      if(e.key!=='Enter') return;
      e.preventDefault();
      submitItemSearch(scanInp.value);
    });

    const cameraBtn = document.getElementById('f-camera-scan');
    if(cameraBtn) cameraBtn.addEventListener('click', ()=>{
      openCameraScanModal((code)=> submitItemSearch(code));
    });
  }

  const custSearchInp = qs('#f-customer-search');
  const custResultsBox = qs('#f-customer-results');
  if(custSearchInp && custResultsBox){
    const renderResults = (query)=>{
      const q = query.trim().toLowerCase();
      if(!q){ custResultsBox.style.display='none'; custResultsBox.innerHTML=''; return; }
      const matches = state.customers.filter(c=>
        c.name.toLowerCase().includes(q) ||
        (c.phone||'').toLowerCase().includes(q) ||
        (c.barcode||'').toLowerCase().includes(q)
      ).slice(0,8);
      if(!matches.length){
        custResultsBox.innerHTML = `<div class="ac-item" style="cursor:default;color:var(--ink-soft);">No matching customers</div>`;
        custResultsBox.style.display='block';
        return;
      }
      custResultsBox.innerHTML = matches.map(c=>`
        <div class="ac-item" data-action="pick-customer" data-id="${c.id}">
          <div>${esc(c.name)}</div>
          <div class="ac-sub">${esc(c.phone || c.barcode || '')}</div>
        </div>`).join('');
      custResultsBox.style.display='block';
      custResultsBox.querySelectorAll('[data-action="pick-customer"]').forEach(el=>{
        el.addEventListener('click', ()=>{
          const c = getCust(el.dataset.id);
          attachCustomerToCart(c);
        });
      });
    };

    custSearchInp.addEventListener('input', ()=> renderResults(custSearchInp.value));
    custSearchInp.addEventListener('focus', ()=> { if(custSearchInp.value.trim()) renderResults(custSearchInp.value); });
    custSearchInp.addEventListener('blur', ()=>{ setTimeout(()=>{ custResultsBox.style.display='none'; }, 150); });

    custSearchInp.addEventListener('keydown', (e)=>{
      if(e.key!=='Enter') return;
      e.preventDefault();
      const code = custSearchInp.value.trim();
      if(!code) return;
      const cust = getCustByBarcode(code);
      if(cust){
        attachCustomerToCart(cust);
        return;
      }
      const nameMatches = state.customers.filter(c=>
        c.name.toLowerCase().includes(code.toLowerCase()) ||
        (c.phone||'').toLowerCase().includes(code.toLowerCase())
      );
      if(nameMatches.length===1){
        attachCustomerToCart(nameMatches[0]);
      } else if(nameMatches.length>1){
        toast('Multiple matches — pick one from the list below.','err');
      } else {
        toast(`No customer found for "${code}".`,'err');
        custSearchInp.select();
      }
    });
  }

  const clearCustBtn = document.querySelector('[data-action="clear-customer"]');
  if(clearCustBtn) clearCustBtn.addEventListener('click', ()=>{
    state.cart.customerId = '';
    save(); renderView();
  });


  document.querySelectorAll('[data-action="cart-qty"]').forEach(btn=>{
    btn.addEventListener('click', ()=>{
      const id = btn.dataset.id, delta = parseInt(btn.dataset.delta);
      const item = state.cart.items.find(i=>i.productId===id);
      const prod = getProd(id);
      if(!item) return;
      const newQty = item.qty + delta;
      if(newQty<=0){ state.cart.items = state.cart.items.filter(i=>i.productId!==id); }
      else if(prod && newQty>prod.stock){ toast(`Only ${prod.stock} in stock.`,'err'); return; }
      else{ item.qty = newQty; }
      save(); renderView();
    });
  });
  document.querySelectorAll('[data-action="cart-remove"]').forEach(btn=>{
    btn.addEventListener('click', ()=>{
      state.cart.items = state.cart.items.filter(i=>i.productId!==btn.dataset.id);
      save(); renderView();
    });
  });

  const clearBtn = document.querySelector('[data-action="clear-cart"]');
  if(clearBtn) clearBtn.addEventListener('click', ()=>{
    state.cart = {items:[], customerId:'', discount:0, paymentMethod:'cash', tendered:'', gcashRef:'', layawayDeposit:'', layawayDepositMethod:'cash', layawayDepositGcashRef:'', splitCash:'', splitGcash:'', splitGcashRef:'', appliedRedemptionCredit:0};
    save(); renderView();
  });

  const completeBtn = document.querySelector('[data-action="complete-sale"]');
  if(completeBtn) completeBtn.addEventListener('click', ()=>{
    if(!state.session.dayOpen){ toast('Open the day before completing a sale.','err'); return; }
    if(!state.cart.items.length){ toast('Cart is empty.','err'); return; }
    for(const item of state.cart.items){
      const prod = getProd(item.productId);
      if(!prod || prod.stock < item.qty){ toast(`Not enough stock for ${item.name}.`,'err'); return; }
    }
    openPaymentModal();
  });

  document.querySelectorAll('[data-action="delete-cash-adjust"]').forEach(btn=>{
    btn.addEventListener('click', ()=>{
      if(confirm('Delete this cash adjustment entry?')){
        state.cashAdjustments = (state.cashAdjustments||[]).filter(a=>a.id!==btn.dataset.id);
        save(); renderView(); toast('Adjustment deleted.','ok');
      }
    });
  });
}

function openPaymentModal(){
  let total = cartTotal();
  const cust = state.cart.customerId ? getCust(state.cart.customerId) : null;
  const credit = cust ? round2(cust.pendingRedemptionCredit||0) : 0;

  openModal('Payment', `
    <div class="field">
      <label>Discount (₱ amount off subtotal)</label>
      <input type="number" min="0" step="0.01" id="m-discount" value="${state.cart.discount}">
    </div>
    ${credit>0 ? `
      <div class="field" id="m-credit-wrap">
        <div class="hint" style="background:var(--teal-tint);padding:10px 12px;border-radius:8px;color:var(--ink);display:flex;justify-content:space-between;align-items:center;flex-wrap:wrap;gap:8px;">
          <span><strong>${esc(cust.name)}</strong> has <strong>${fmt(credit)}</strong> reward credit available.</span>
          <button type="button" class="btn btn-primary btn-sm" id="m-apply-credit">Apply Credit</button>
        </div>
      </div>
    ` : ''}
    <div class="field">
      <label>Payment method</label>
      <div class="radio-row">
        <label class="radio-opt ${state.cart.paymentMethod==='cash'?'checked':''}"><input type="radio" name="m-pm" value="cash" ${state.cart.paymentMethod==='cash'?'checked':''}> Cash</label>
        <label class="radio-opt ${state.cart.paymentMethod==='layaway'?'checked':''}"><input type="radio" name="m-pm" value="layaway" ${state.cart.paymentMethod==='layaway'?'checked':''}> Lay-away</label>
        <label class="radio-opt ${state.cart.paymentMethod==='split'?'checked':''}"><input type="radio" name="m-pm" value="split" ${state.cart.paymentMethod==='split'?'checked':''}> Split Payment</label>
      </div>
      <div class="hint">GCash isn't taken at checkout here. To log a GCash payment for a walk-in purchase, use the GCash Sales tab.</div>
    </div>
    <div id="pm-fields">${renderPaymentFieldsHTML(total)}</div>
  `, `<button class="btn btn-ghost" data-action="close-modal">Cancel</button><button class="btn btn-primary" id="m-confirm">Complete Sale <span style="opacity:.7;font-weight:500;">(Enter)</span></button>`, {maxWidth:'600px', tallBody:true});

  const applyCreditBtn = document.getElementById('m-apply-credit');
  if(applyCreditBtn) applyCreditBtn.addEventListener('click', ()=>{
    const discInp = document.getElementById('m-discount');
    const sub = cartSubtotal();
    const currentDisc = Number(discInp.value)||0;
    const applyAmt = Math.min(credit, Math.max(0, sub - currentDisc));
    if(applyAmt<=0){ toast('Discount already covers the full subtotal.','err'); return; }
    discInp.value = round2(currentDisc + applyAmt);
    state.cart.discount = discInp.value;
    state.cart.appliedRedemptionCredit = round2((Number(state.cart.appliedRedemptionCredit)||0) + applyAmt);
    save();
    document.getElementById('m-credit-wrap').innerHTML = `<div class="hint" style="background:var(--teal-tint);padding:10px 12px;border-radius:8px;color:var(--ink);">Applied ${fmt(applyAmt)} reward credit to this sale.</div>`;
    refreshPmFieldsAfterDiscountChange();
  });

  const refreshPmFieldsAfterDiscountChange = ()=>{
    total = cartTotal();
    document.getElementById('pm-fields').innerHTML = renderPaymentFieldsHTML(total);
    bindPmFields(total);
  };

  const refreshPmFields = ()=>{
    total = cartTotal();
    document.getElementById('pm-fields').innerHTML = renderPaymentFieldsHTML(total);
    bindPmFields(total);
  };

  document.getElementById('m-discount').addEventListener('input', (e)=>{
    state.cart.discount = e.target.value;
    save();
    refreshPmFields();
  });

  document.querySelectorAll('input[name="m-pm"]').forEach(r=>{
    r.addEventListener('change', ()=>{
      state.cart.paymentMethod = r.value;
      save();
      document.querySelectorAll('input[name="m-pm"]').forEach(x=> x.closest('.radio-opt').classList.toggle('checked', x.checked));
      refreshPmFields();
    });
  });

  bindPmFields(total);

  document.getElementById('m-confirm').addEventListener('click', ()=>{
    if(!validateSaleForCompletion()) return;
    requireAuth('Complete Sale — Store', ()=>{ completeSale(); });
  });

  document.querySelector('.modal-body').addEventListener('keydown', (e)=>{
    if(e.key==='Enter' && e.target.tagName!=='TEXTAREA'){
      e.preventDefault();
      document.getElementById('m-confirm').click();
    }
  });
}

function renderPaymentFieldsHTML(total){
  const pm = state.cart.paymentMethod;
  if(pm==='cash'){
    return `
      <div style="text-align:center;margin:8px 0 14px;">
        <div class="hint" style="margin-bottom:2px;">Total due</div>
        <div style="font-family:'IBM Plex Mono',monospace;font-size:28px;font-weight:700;">${fmt(total)}</div>
      </div>
      <div class="field-row">
        <div class="field">
          <label>Amount tendered</label>
          <input type="text" inputmode="decimal" id="m-tendered" placeholder="0.00" value="${esc(state.cart.tendered||'')}" style="font-size:18px;text-align:right;font-family:'IBM Plex Mono',monospace;" autocomplete="off">
        </div>
        <div class="field" style="display:flex;align-items:flex-end;">
          <button type="button" class="btn btn-ghost btn-block" id="m-exact">Exact &amp; Complete Sale (${fmt(total)}) <span style="opacity:.7;font-weight:500;">(F5)</span></button>
        </div>
      </div>
      <div class="tot-row"><span>Change</span><span class="mono" id="m-change">${fmt(0)}</span></div>
      <div id="m-tendered-warn" class="hint" style="color:var(--red);display:none;margin-top:4px;">Amount tendered is less than the total due.</div>
    `;
  } else if(pm==='layaway'){
    const dep = Number(state.cart.layawayDeposit)||0;
    const depMethod = state.cart.layawayDepositMethod || 'cash';
    return `
      <div class="field">
        <label>Initial deposit</label>
        <input type="number" min="0" step="0.01" id="m-deposit" value="${state.cart.layawayDeposit}" placeholder="0.00">
      </div>
      <div class="field">
        <label>Deposit payment method</label>
        <div class="radio-row">
          <label class="radio-opt ${depMethod==='cash'?'checked':''}"><input type="radio" name="m-depm" value="cash" ${depMethod==='cash'?'checked':''}> Cash</label>
          <label class="radio-opt ${depMethod==='gcash'?'checked':''}"><input type="radio" name="m-depm" value="gcash" ${depMethod==='gcash'?'checked':''}> GCash</label>
        </div>
      </div>
      <div class="field" id="m-dep-gcashref-wrap" style="${depMethod==='gcash'?'':'display:none;'}">
        <label>GCash reference number</label>
        <input type="text" id="m-dep-gcashref" value="${esc(state.cart.layawayDepositGcashRef||'')}" placeholder="e.g. 0123456789012">
      </div>
      <div class="tot-row"><span>Remaining balance</span><span class="mono" id="m-lay-remaining">${fmt(Math.max(total-dep,0))}</span></div>
      <div class="hint">A customer must be selected for lay-away orders. Stock is reserved immediately.</div>
    `;
  } else if(pm==='split'){
    const splitCash = Number(state.cart.splitCash)||0;
    const splitGcash = Number(state.cart.splitGcash)||0;
    const remaining = round2(total - splitCash - splitGcash);
    return `
      <div class="field-row">
        <div class="field"><label>Cash amount</label><input type="number" min="0" step="0.01" id="m-split-cash" value="${state.cart.splitCash}" placeholder="0.00"></div>
        <div class="field"><label>GCash amount</label><input type="number" min="0" step="0.01" id="m-split-gcash" value="${state.cart.splitGcash}" placeholder="0.00"></div>
      </div>
      <div class="field" id="m-split-gcashref-wrap" style="${splitGcash>0?'':'display:none;'}">
        <label>GCash reference number</label>
        <input type="text" id="m-split-gcashref" value="${esc(state.cart.splitGcashRef||'')}" placeholder="e.g. 0123456789012">
      </div>
      <div class="tot-row"><span>Remaining (Lay-away)</span><span class="mono" id="m-split-remaining">${fmt(Math.max(remaining,0))}</span></div>
      <div id="m-split-warn-over" class="hint" style="color:var(--red);${remaining<-0.004?'':'display:none;'}">Cash + GCash is more than the total due.</div>
      <div id="m-split-note-partial" class="hint" style="${remaining>0.004?'':'display:none;'}">The remaining amount will be saved as a lay-away balance. A customer must be selected.</div>
      <div id="m-split-note-full" class="hint" style="${remaining<=0.004?'':'display:none;'}">Fully covered by Cash + GCash — no lay-away balance will be created.</div>
    `;
  }
  return '';
}

function bindPmFields(total){
  const pm = state.cart.paymentMethod;

  if(pm==='cash'){
    const tInp = document.getElementById('m-tendered');
    const changeEl = document.getElementById('m-change');
    const warnEl = document.getElementById('m-tendered-warn');
    const refresh = ()=>{
      const val = Number(tInp.value)||0;
      changeEl.textContent = fmt(Math.max(round2(val-total),0));
      warnEl.style.display = (tInp.value!=='' && val<total) ? 'block' : 'none';
    };
    tInp.addEventListener('input', ()=>{ state.cart.tendered = tInp.value; refresh(); });
    tInp.focus();
    document.getElementById('m-exact').addEventListener('click', ()=>{
      tInp.value = total.toFixed(2);
      state.cart.tendered = tInp.value;
      refresh();
      document.getElementById('m-confirm').click();
    });
    refresh();

  } else if(pm==='layaway'){
    const depInp = document.getElementById('m-deposit');
    const remainingEl = document.getElementById('m-lay-remaining');
    if(depInp){
      depInp.addEventListener('input', ()=>{
        state.cart.layawayDeposit = depInp.value;
        const dep = Number(depInp.value)||0;
        remainingEl.textContent = fmt(Math.max(total-dep,0));
      });
    }
    document.querySelectorAll('input[name="m-depm"]').forEach(r=>{
      r.addEventListener('change', ()=>{
        state.cart.layawayDepositMethod = r.value;
        document.getElementById('m-dep-gcashref-wrap').style.display = r.value==='gcash' ? 'block' : 'none';
        document.querySelectorAll('input[name="m-depm"]').forEach(x=> x.closest('.radio-opt').classList.toggle('checked', x.checked));
      });
    });
    const depRefInp = document.getElementById('m-dep-gcashref');
    if(depRefInp) depRefInp.addEventListener('input', ()=>{ state.cart.layawayDepositGcashRef = depRefInp.value; });

  } else if(pm==='split'){
    const cInp = document.getElementById('m-split-cash');
    const gInp = document.getElementById('m-split-gcash');
    const gRefWrap = document.getElementById('m-split-gcashref-wrap');
    const remainingEl = document.getElementById('m-split-remaining');
    const warnOver = document.getElementById('m-split-warn-over');
    const notePartial = document.getElementById('m-split-note-partial');
    const noteFull = document.getElementById('m-split-note-full');

    const refresh = ()=>{
      const splitCash = Number(cInp.value)||0;
      const splitGcash = Number(gInp.value)||0;
      const remaining = round2(total - splitCash - splitGcash);
      remainingEl.textContent = fmt(Math.max(remaining,0));
      warnOver.style.display = remaining < -0.004 ? 'block' : 'none';
      notePartial.style.display = remaining > 0.004 ? 'block' : 'none';
      noteFull.style.display = remaining <= 0.004 ? 'block' : 'none';
      gRefWrap.style.display = splitGcash > 0 ? 'block' : 'none';
    };

    if(cInp) cInp.addEventListener('input', ()=>{ state.cart.splitCash = cInp.value; refresh(); });
    if(gInp) gInp.addEventListener('input', ()=>{ state.cart.splitGcash = gInp.value; refresh(); });
    const gRefInp = document.getElementById('m-split-gcashref');
    if(gRefInp) gRefInp.addEventListener('input', ()=>{ state.cart.splitGcashRef = gRefInp.value; });
  }
}

function validateSaleForCompletion(){
  if(!state.session.dayOpen){ toast('Open the day before completing a sale.','err'); return false; }
  if(!state.cart.items.length){ toast('Cart is empty.','err'); return false; }
  const total = cartTotal();
  const pm = state.cart.paymentMethod;

  for(const item of state.cart.items){
    const prod = getProd(item.productId);
    if(!prod || prod.stock < item.qty){ toast(`Not enough stock for ${item.name}.`,'err'); return false; }
  }

  if(pm==='cash'){
    const tendered = Number(state.cart.tendered)||0;
    if(tendered < total){ toast('Amount tendered is less than total due.','err'); return false; }
  }
  if(pm==='layaway'){
    if(!state.cart.customerId){ toast('Select a customer for lay-away orders.','err'); return false; }
    const dep = Number(state.cart.layawayDeposit)||0;
    if(dep<=0){ toast('Enter an initial deposit amount.','err'); return false; }
    if(dep>total){ toast('Deposit cannot exceed the total.','err'); return false; }
    if(state.cart.layawayDepositMethod==='gcash' && !(state.cart.layawayDepositGcashRef||'').trim()){ toast('Enter the GCash reference number for the deposit.','err'); return false; }
  }
  if(pm==='split'){
    const splitCash = Number(state.cart.splitCash)||0;
    const splitGcash = Number(state.cart.splitGcash)||0;
    if(splitCash<0 || splitGcash<0){ toast('Amounts cannot be negative.','err'); return false; }
    if(splitCash===0 && splitGcash===0){ toast('Enter at least one amount (Cash or GCash).','err'); return false; }
    const remaining = round2(total - splitCash - splitGcash);
    if(remaining < -0.004){ toast('Cash + GCash is more than the total due.','err'); return false; }
    if(splitGcash>0 && !(state.cart.splitGcashRef||'').trim()){ toast('Enter the GCash reference number.','err'); return false; }
    if(remaining > 0.004 && !state.cart.customerId){ toast('Select a customer — part of this sale will be recorded as a lay-away balance.','err'); return false; }
  }
  return true;
}

function completeSale(){
  if(!validateSaleForCompletion()) return false;
  const sub = cartSubtotal();
  const disc = Math.min(Number(state.cart.discount)||0, sub);
  const total = cartTotal();
  const pm = state.cart.paymentMethod;

  // deduct stock
  state.cart.items.forEach(item=>{ const prod = getProd(item.productId); if(prod && !prod.nonInventory) prod.stock -= item.qty; });

  const itemsSnapshot = state.cart.items.map(i=>({productId:i.productId,name:i.name,qty:i.qty,price:i.price,subtotal:round2(i.qty*i.price)}));

  if(pm==='layaway'){
    const dep = Number(state.cart.layawayDeposit)||0;
    const layaway = {
      id:uid('lay'), receiptNo: nextReceiptNo(), date:Date.now(),
      customerId: state.cart.customerId, items: itemsSnapshot,
      subtotal: sub, discount: disc, total,
      deposit: dep, balance: round2(total-dep),
      payments:[{date:Date.now(), amount:dep, method: state.cart.layawayDepositMethod||'cash', gcashRef: state.cart.layawayDepositMethod==='gcash' ? (state.cart.layawayDepositGcashRef||'').trim() : ''}],
      status: (round2(total-dep)<=0? 'completed':'active'),
      createdAt: Date.now(), completedAt: round2(total-dep)<=0? Date.now(): null
    };
    state.layaways.push(layaway);
    layaway.pointsEarned = awardRewardsPoints(layaway.customerId, layaway.total, `Lay-away ${layaway.receiptNo}`);
    printReceipt({type:'layaway', record:layaway});
    maybeOpenDrawer(state.cart.layawayDepositMethod||'cash');
    toast('Lay-away order created.','ok');
  } else if(pm==='split'){
    const splitCash = Number(state.cart.splitCash)||0;
    const splitGcash = Number(state.cart.splitGcash)||0;
    const splitGcashRef = (state.cart.splitGcashRef||'').trim();
    const remaining = round2(total - splitCash - splitGcash);

    if(remaining > 0.004){
      // part of the total is deferred — record as a lay-away with what's already been paid as the deposit
      const payments = [];
      if(splitCash>0) payments.push({date:Date.now(), amount:splitCash, method:'cash'});
      if(splitGcash>0) payments.push({date:Date.now(), amount:splitGcash, method:'gcash', gcashRef:splitGcashRef});
      const layaway = {
        id:uid('lay'), receiptNo: nextReceiptNo(), date:Date.now(),
        customerId: state.cart.customerId, items: itemsSnapshot,
        subtotal: sub, discount: disc, total,
        deposit: round2(splitCash+splitGcash), balance: remaining,
        payments, status:'active', createdAt: Date.now(), completedAt: null,
        splitPayment: { cash: splitCash, gcash: splitGcash, gcashRef: splitGcashRef }
      };
      state.layaways.push(layaway);
      layaway.pointsEarned = awardRewardsPoints(layaway.customerId, layaway.total, `Lay-away ${layaway.receiptNo}`);
      printReceipt({type:'layaway', record:layaway});
      maybeOpenDrawer(splitCash>0 ? 'cash' : 'gcash');
      toast('Split payment recorded — remaining balance saved as lay-away.','ok');
    } else {
      const sale = {
        id:uid('sal'), receiptNo: nextReceiptNo(), date:Date.now(),
        items: itemsSnapshot, subtotal: sub, discount: disc, tax: round2(total-(sub-disc)), total,
        paymentMethod: 'split', splitCash, splitGcash, splitGcashRef,
        tendered: total, change: 0, gcashRef: '',
        customerId: state.cart.customerId || null, voided:false
      };
      state.sales.push(sale);
      sale.pointsEarned = awardRewardsPoints(sale.customerId, sale.total, `Sale ${sale.receiptNo}`);
      printReceipt({type:'sale', record:sale});
      maybeOpenDrawer(splitCash>0 ? 'cash' : 'gcash');
      toast('Split payment sale completed.','ok');
    }
  } else {
    const sale = {
      id:uid('sal'), receiptNo: nextReceiptNo(), date:Date.now(),
      items: itemsSnapshot, subtotal: sub, discount: disc, tax: round2(total-(sub-disc)), total,
      paymentMethod: pm, tendered: pm==='cash'? Number(state.cart.tendered)||0 : total,
      change: pm==='cash'? round2((Number(state.cart.tendered)||0)-total) : 0,
      gcashRef: pm==='gcash'? state.cart.gcashRef.trim() : '',
      customerId: state.cart.customerId || null, voided:false
    };
    state.sales.push(sale);
    sale.pointsEarned = awardRewardsPoints(sale.customerId, sale.total, `Sale ${sale.receiptNo}`);
    printReceipt({type:'sale', record:sale});
    maybeOpenDrawer(pm);
    toast('Sale completed.','ok');
  }

  const appliedCredit = round2(Number(state.cart.appliedRedemptionCredit)||0);
  if(appliedCredit>0 && state.cart.customerId){
    const creditCust = getCust(state.cart.customerId);
    if(creditCust) creditCust.pendingRedemptionCredit = Math.max(0, round2((creditCust.pendingRedemptionCredit||0) - appliedCredit));
  }

  state.cart = {items:[], customerId:'', discount:0, paymentMethod:'cash', tendered:'', gcashRef:'', layawayDeposit:'', layawayDepositMethod:'cash', layawayDepositGcashRef:'', splitCash:'', splitGcash:'', splitGcashRef:'', appliedRedemptionCredit:0};
  save(); renderView();
  return true;
}

function todayDateStrCompact(){
  const d = new Date();
  const mm = String(d.getMonth()+1).padStart(2,'0');
  const dd = String(d.getDate()).padStart(2,'0');
  const yyyy = d.getFullYear();
  return `${mm}${dd}${yyyy}`;
}

function nextReceiptNo(){
  const allReceipts = [
    ...state.sales.map(s=>s.receiptNo),
    ...state.layaways.map(l=>l.receiptNo),
    ...(state.gcashManual||[]).map(m=>m.receiptNo)
  ];
  const count = allReceipts.filter(r=> r && r.startsWith('J&R-')).length;
  const n = count + 1;
  return `J&R-${todayDateStrCompact()}-${String(n).padStart(5,'0')}`;
}

/* ============================================================
   PRINT SETUP — paper size / margins, applied dynamically
============================================================ */
function applyPrintCSS(kind){
  kind = kind || 'sale';
  const base = state.meta.printerSettings || {};
  // GCash receipts can be tuned independently from Store Sales receipts (margins,
  // offset, font size) since their content shape differs — longer reference
  // numbers/notes, a bigger receipt-number line, etc. Paper size, printer output
  // mode, and the physical printer connection stay shared, since those are about
  // the hardware itself, not the receipt layout.
  const gcashOverrides = state.meta.gcashPrinterSettings || {};
  const ps = kind==='gcash' ? { ...base, ...gcashOverrides } : base;
  const width = ps.paperSize==='80mm' ? '80mm' : '58mm';
  let styleEl = document.getElementById('dynamic-print-style');
  if(!styleEl){ styleEl = document.createElement('style'); styleEl.id='dynamic-print-style'; document.head.appendChild(styleEl); }
  // Margins come straight from Settings — Top/Right/Bottom/Left, in mm, no hidden
  // baseline added on top. 0 on all sides means the content fills the paper edge
  // to edge (aside from the printer's own unprintable hardware margin, if any).
  const mt = Number(ps.marginTop)||0, mr = Number(ps.marginRight)||0, mb = Number(ps.marginBottom)||0, ml = Number(ps.marginLeft)||0;
  // Horizontal offset shifts the whole receipt left/right without changing its
  // width: positive nudges it right (adds to the left margin, subtracts from the
  // right), negative nudges it left. This is separate from the four Top/Right/
  // Bottom/Left margins, which control the fixed inset on each side.
  const hOffset = Number(ps.hOffset)||0;
  const effMl = ml + hOffset, effMr = mr - hOffset;
  const fontPt = Number(ps.fontSizePt) || 10;
  // @page margin is intentionally always 0 — some browsers/printers add their own
  // default page margin on top of it, and if the printable area ends up narrower
  // than #print-area's declared width, the content overflows and prints shifted
  // to one side instead of clipping evenly. Instead, #print-area's own width is
  // shrunk by the left+right margins and explicitly positioned, so it lands
  // exactly where Settings says no matter what the print dialog adds.
  styleEl.textContent = `
    @page { size: ${width} auto; margin: 0; }
    html, body { margin:0 !important; padding:0 !important; }
    #print-area{
      width: calc(${width} - ${effMl}mm - ${effMr}mm);
      max-width: calc(${width} - ${effMl}mm - ${effMr}mm);
      box-sizing:border-box;
      margin: ${mt}mm ${effMr}mm ${mb}mm ${effMl}mm !important;
      padding: 0 !important;
      font-size: ${fontPt}pt !important;
    }
    #print-area .receipt-no-big{ font-size:${fontPt+2}pt !important; font-weight:700; }
  `;
}

/* ============================================================
   CASH DRAWER — via Web Serial (works with USB/serial ESC/POS
   thermal printers that have a drawer-kick port). Only supported
   in Chromium desktop browsers (Chrome/Edge).
============================================================ */
let drawerPort = null;
let usbPrinterDevice = null;
let usbPrinterEndpoint = null;

function serialSupported(){ return 'serial' in navigator; }
function usbSupported(){ return 'usb' in navigator; }
function printerConnected(){ return !!drawerPort || !!usbPrinterDevice; }

async function connectDrawerPort(){
  if(!serialSupported()){ toast('This browser cannot talk to a serial printer. Use Chrome or Edge on a desktop computer.','err'); return; }
  try{
    const port = await navigator.serial.requestPort();
    const baudRate = Number((state.meta.printerSettings||{}).baudRate) || 9600;
    await port.open({ baudRate });
    drawerPort = port;
    toast(`Printer / cash drawer connected (Serial, ${baudRate} baud).`,'ok');
    renderView();
  }catch(e){
    if(e && e.name==='NotFoundError'){ /* user cancelled the picker */ return; }
    toast('Could not connect: ' + (e.message||e), 'err');
  }
}

async function disconnectDrawerPort(){
  if(!drawerPort) return;
  try{ await drawerPort.close(); }catch(e){ /* ignore */ }
  drawerPort = null;
  renderView();
  toast('Disconnected.','ok');
}

async function connectUsbPrinter(){
  if(!usbSupported()){ toast('This browser cannot talk to a USB printer. Use Chrome or Edge on a desktop computer.','err'); return; }
  try{
    const device = await navigator.usb.requestDevice({ filters: [] });
    await device.open();
    if(!device.configuration) await device.selectConfiguration(1);
    let ifaceNum = null, epOut = null;
    // Prefer the standard USB Printer class (7) if the device declares one —
    // most receipt printers do. Otherwise fall back to any interface that
    // exposes a bulk/interrupt OUT endpoint, which covers vendor-specific
    // implementations that don't use the Printer class at all.
    const interfaces = device.configuration.interfaces;
    let printerIface = interfaces.find(iface => iface.alternates.some(a => a.interfaceClass===7));
    if(printerIface){
      const alt = printerIface.alternates.find(a => a.interfaceClass===7) || printerIface.alternates[0];
      const out = alt.endpoints.find(e=>e.direction==='out');
      if(out){ ifaceNum = printerIface.interfaceNumber; epOut = out.endpointNumber; }
    }
    if(ifaceNum===null){
      for(const iface of interfaces){
        const alt = iface.alternates[0];
        const out = alt.endpoints.find(e=>e.direction==='out');
        if(out){ ifaceNum = iface.interfaceNumber; epOut = out.endpointNumber; break; }
      }
    }
    if(ifaceNum===null){ toast('Could not find a usable USB print interface on that device.','err'); await device.close(); return; }
    await device.claimInterface(ifaceNum);
    usbPrinterDevice = device;
    usbPrinterEndpoint = epOut;
    toast('Printer connected (USB).','ok');
    renderView();
  }catch(e){
    if(e && e.name==='NotFoundError'){ /* user cancelled the picker */ return; }
    toast('Could not connect: ' + (e.message||e), 'err');
  }
}

async function disconnectUsbPrinter(){
  if(!usbPrinterDevice) return;
  try{ await usbPrinterDevice.close(); }catch(e){ /* ignore */ }
  usbPrinterDevice = null;
  usbPrinterEndpoint = null;
  renderView();
  toast('Disconnected.','ok');
}

// Sends raw bytes to whichever printer connection is active — Serial (USB-to-serial
// or Bluetooth SPP, e.g. the XP-58H over Bluetooth) or WebUSB (the XP-58H over USB).
async function sendRawBytes(bytes){
  if(usbPrinterDevice){
    try{
      await usbPrinterDevice.transferOut(usbPrinterEndpoint, bytes);
      return true;
    }catch(e){
      toast('USB print failed: ' + (e.message||e), 'err');
      return false;
    }
  }
  if(drawerPort){
    try{
      const writer = drawerPort.writable.getWriter();
      await writer.write(bytes);
      writer.releaseLock();
      return true;
    }catch(e){
      toast('Print failed: ' + (e.message||e), 'err');
      return false;
    }
  }
  toast('Connect the printer in Settings → Receipt printing first.','err');
  return false;
}

async function kickCashDrawer(){
  if(!printerConnected()){ toast('Connect a printer/drawer in Settings first.','err'); return false; }
  // Standard ESC/POS drawer-kick command (pin 2, common default): ESC p 0 25 250
  const cmd = new Uint8Array([0x1B, 0x70, 0x00, 0x19, 0xFA]);
  return sendRawBytes(cmd);
}

function maybeOpenDrawer(paymentMethod){
  const ps = state.meta.printerSettings || {};
  if(!ps.autoOpenDrawer) return;
  if(ps.autoOpenDrawerCashOnly && paymentMethod!=='cash') return;
  kickCashDrawer().then(ok=>{ if(ok) toast('Cash drawer opened.','ok'); });
}

/* ============================================================
   DIRECT PRINTING — raw ESC/POS text sent over the same Web
   Serial connection used for the cash drawer. Works with the
   XP-58H (and similar Xprinter models) because their Bluetooth
   is Classic Bluetooth SPP — once paired in the OS, it shows up
   as a normal serial/COM port that Web Serial can talk to
   directly, exactly like a USB connection.
============================================================ */
function escposWidth(){ return (state.meta.printerSettings||{}).paperSize==='80mm' ? 48 : 32; }
function escposCenterLine(text, width){
  text = String(text||'');
  if(text.length>=width) return text.slice(0,width);
  const pad = Math.floor((width-text.length)/2);
  return ' '.repeat(pad) + text;
}
function escposRowLine(left, right, width){
  left = String(left||''); right = String(right||'');
  const space = Math.max(1, width - left.length - right.length);
  if(space<1){ return (left+' '+right).slice(0,width); }
  return left + ' '.repeat(space) + right;
}

    }
    if(record.paymentMethod==='split'){

      L.push({t:'r', l:'  GCash', r: fmt(record.splitGcash)});

  L.push({t:'c', text: `Receipt #: ${record.receiptNo}`});
  L.push({t:'c', text: 'Thank you!'});

}

  const netTotal = isCashIn ? round2(entry.amount + (entry.serviceFee||0)) : round2(entry.amount - (entry.serviceFee||0));
  const L = [];

  L.push({t:'hr'});

  L.push({t:'hr'});

async function sendEscPosLines(lines){
  if(!printerConnected()){ toast('Connect the printer in Settings → Receipt printing first.','err'); return false; }
  const width = escposWidth();
  const fontPt = Number((state.meta.printerSettings||{}).fontSizePt) || 10;
  const enc = new TextEncoder();
  const bytes = [];
  bytes.push(0x1B,0x40); // ESC @ — initialize printer
  bytes.push(0x1B,0x4D, fontPt<=8 ? 0x01 : 0x00); // ESC M n — Font B (smaller) at 8pt, Font A (normal) at 9–10pt
  lines.forEach(line=>{
    let text;
    if(line.t==='hr') text = '-'.repeat(width);
    else if(line.t==='c') text = escposCenterLine(line.text, width);
    else text = escposRowLine(line.l, line.r, width);
    if(line.big) bytes.push(0x1D,0x21,0x01); // GS ! 1 — double height, for emphasis (e.g. the receipt number)
    bytes.push(...enc.encode(text));
    bytes.push(0x0A);
    if(line.big) bytes.push(0x1D,0x21,0x00); // GS ! 0 — back to normal size
  });
  bytes.push(0x0A,0x0A,0x0A,0x0A);
  bytes.push(0x1D,0x56,0x01); // GS V 1 — partial cut (XP-58H supports auto-cutter)
  return sendRawBytes(new Uint8Array(bytes));
}

function printReceipt({type, record}){
  const ps = state.meta.printerSettings || {};
  if(ps.outputMode==='direct'){
    if(printerConnected()){
      const lines = buildSaleReceiptLines(record, type, escposWidth());
      sendEscPosLines(lines).then(ok=>{ if(ok) toast('Sent to printer.','ok'); });
      return;
    }
    toast('Printer output is set to "Direct" but the printer isn\'t connected — falling back to the print dialog. Connect it in Settings → Receipt printing.','err');
  }
  applyPrintCSS();
  const area = document.getElementById('print-area');
  const cust = record.customerId? getCust(record.customerId) : null;
  let rows = record.items.map(i=>`<div class="prow"><span>${esc(i.name)} x${i.qty}</span><span>${fmt(i.subtotal)}</span></div>`).join('');
  let extra = '';
  if(type==='sale'){
    extra = `
      <div class="prow"><span>Payment</span><span>${record.paymentMethod.toUpperCase()}</span></div>
      ${record.paymentMethod==='cash'? `<div class="prow"><span>Tendered</span><span>${fmt(record.tendered)}</span></div><div class="prow"><span>Change</span><span>${fmt(record.change)}</span></div>` : ''}
      ${record.paymentMethod==='gcash'? `<div class="prow"><span>Ref#</span><span>${esc(record.gcashRef)}</span></div>` : ''}
      ${record.paymentMethod==='split'? `

  if(collapseAll) collapseAll.addEventListener('click', ()=>{
    state.departments.forEach(d=>state.ui.invExpandedDepts[d.id]=false);
    state.categories.forEach(c=>state.ui.invExpandedCats[c.id]=false);

  document.querySelectorAll('[data-action="delete-product"]').forEach(b=>b.addEventListener('click',()=>{

function csvEscape(val){
  val = String(val==null? '' : val);
  if(/[",\n]/.test(val)){ return `"${val.replace(/"/g,'""')}"`; }
  return val;
}

function parseCSV(text){
  // Minimal CSV parser: handles quoted fields (with embedded commas/newlines/escaped quotes).
  const rows = [];
  let row = [], field = '', inQuotes = false;
  for(let i=0; i<text.length; i++){
    const c = text[i];
    if(inQuotes){
      if(c === '"'){
        if(text[i+1] === '"'){ field += '"'; i++; }
        else { inQuotes = false; }
      } else { field += c; }
    } else {
      if(c === '"'){ inQuotes = true; }
      else if(c === ','){ row.push(field); field = ''; }
      else if(c === '\n' || c === '\r'){
        if(c === '\r' && text[i+1] === '\n') i++;
        row.push(field); field = '';
        if(row.length>1 || row[0]!==''){ rows.push(row); }
        row = [];
      } else { field += c; }
    }
  }
  if(field!=='' || row.length){ row.push(field); rows.push(row); }
  return rows;
}

function exportInventoryCSV(){
  const header = ['Barcode','Name','Department','Category','Price','Cost','Stock','Reorder Level','Type'];
  const lines = [header.map(csvEscape).join(',')];
  state.products.slice().sort((a,b)=>a.name.localeCompare(b.name)).forEach(p=>{
    const dept = getDept(p.departmentId);
    const cat = getCat(p.categoryId);
    lines.push([
      p.barcode||'', p.name||'', dept?dept.name:'', cat?cat.name:'',
      p.price||0, p.cost||0, p.stock||0, p.reorderLevel||0, p.nonInventory?'Service':'Inventory'
    ].map(csvEscape).join(','));
  });
  const blob = new Blob([lines.join('\r\n')], {type:'text/csv;charset=utf-8;'});
  const url = URL.createObjectURL(blob);
  const a = document.createElement('a');
  a.href = url;
  a.download = `inventory-export-${todayStr()}.csv`;
  document.body.appendChild(a); a.click(); document.body.removeChild(a);
  URL.revokeObjectURL(url);
  toast(`Exported ${state.products.length} products.`,'ok');
}

function importInventoryCSV(text){
  const rows = parseCSV(text);
  if(!rows.length){ toast('That file looks empty.','err'); return; }
  const header = rows[0].map(h=>h.trim().toLowerCase());
  const idx = {
    barcode: header.indexOf('barcode'),
    name: header.indexOf('name'),
    department: header.indexOf('department'),
    category: header.indexOf('category'),
    price: header.indexOf('price'),
    cost: header.indexOf('cost'),
    stock: header.indexOf('stock'),
    reorder: header.findIndex(h=>h.includes('reorder')),
    type: header.indexOf('type')
  };
  if(idx.barcode===-1 || idx.name===-1 || idx.department===-1 || idx.category===-1){
    toast('CSV must have at least Barcode, Name, Department, and Category columns.','err');
    return;
  }

  let added = 0, updated = 0, skipped = 0;

  for(let r=1; r<rows.length; r++){
    const row = rows[r];
    if(!row || row.every(c=>c.trim()==='')) continue;
    const barcode = (row[idx.barcode]||'').trim();
    const name = (row[idx.name]||'').trim();
    const deptName = (row[idx.department]||'').trim();
    const catName = (row[idx.category]||'').trim();
    const price = idx.price>-1 ? Number(row[idx.price])||0 : 0;
    const cost = idx.cost>-1 ? Number(row[idx.cost])||0 : 0;
    const stock = idx.stock>-1 ? Number(row[idx.stock])||0 : 0;
    const reorderLevel = idx.reorder>-1 ? Number(row[idx.reorder])||0 : 5;
    const nonInventory = idx.type>-1 ? (row[idx.type]||'').trim().toLowerCase()==='service' : false;

    if(!barcode || !name || !deptName || !catName){ skipped++; continue; }

    let dept = state.departments.find(d=>d.name.toLowerCase()===deptName.toLowerCase());
    if(!dept){ dept = {id:uid('dep'), name:deptName}; state.departments.push(dept); }

    let cat = state.categories.find(c=>c.departmentId===dept.id && c.name.toLowerCase()===catName.toLowerCase());
    if(!cat){ cat = {id:uid('cat'), name:catName, departmentId:dept.id}; state.categories.push(cat); }

    const existing = state.products.find(p=>p.barcode===barcode);
    if(existing){
      Object.assign(existing, {name, departmentId:dept.id, categoryId:cat.id, price, cost, reorderLevel, nonInventory});
      if(idx.stock>-1) existing.stock = stock;
      updated++;
    } else {
      state.products.push({id:uid('prd'), name, barcode, departmentId:dept.id, categoryId:cat.id, price, cost, stock, reorderLevel, nonInventory});
      added++;
    }
  }

  save(); renderView();
  toast(`Import done — ${added} added, ${updated} updated${skipped?`, ${skipped} skipped (missing required fields)`:''}.`, 'ok');
}

function openDepartmentModal(id){
  const dep = id? getDept(id) : null;
  openModal(dep? 'Edit Department':'Add Department', `
    <div class="field"><label>Department name</label><input id="m-name" value="${dep?esc(dep.name):''}" placeholder="e.g. Grocery"></div>
  `, `<button class="btn btn-ghost" data-action="close-modal">Cancel</button><button class="btn btn-primary" id="m-save">Save</button>`);
  document.getElementById('m-save').addEventListener('click', ()=>{
    const name = document.getElementById('m-name').value.trim();
    if(!name){ toast('Enter a name.','err'); return; }
    if(dep) dep.name = name; else state.departments.push({id:uid('dep'), name});
    save(); closeModal(); renderView(); toast('Department saved.','ok');
  });
}

function openCategoryModal(id){
  const cat = id? getCat(id) : null;
  const deptOptions = state.departments.map(d=>`<option value="${d.id}" ${cat && cat.departmentId===d.id?'selected':''}>${esc(d.name)}</option>`).join('');
  openModal(cat? 'Edit Category':'Add Category', `
    <div class="field"><label>Category name</label><input id="m-name" value="${cat?esc(cat.name):''}" placeholder="e.g. Beverages"></div>
    <div class="field"><label>Department</label><select id="m-dept">${deptOptions}</select></div>
  `, `<button class="btn btn-ghost" data-action="close-modal">Cancel</button><button class="btn btn-primary" id="m-save">Save</button>`);
  document.getElementById('m-save').addEventListener('click', ()=>{
    const name = document.getElementById('m-name').value.trim();
    const departmentId = document.getElementById('m-dept').value;
    if(!name){ toast('Enter a name.','err'); return; }
    if(!departmentId){ toast('Add a department first.','err'); return; }

    save(); closeModal(); renderView(); toast('Category saved.','ok');

}

function openProductModal(id){
  const prod = id? getProd(id) : null;
  const dept0 = prod? prod.departmentId : (state.departments[0]?.id||'');
  const buildDeptOptions = (selectedId)=>{
    const opts = state.departments.map(d=>`<option value="${d.id}" ${selectedId===d.id?'selected':''}>${esc(d.name)}</option>`).join('');
    return opts + `<option value="__new__">+ Add new department…</option>`;
  };
  const buildCatOptions = (deptId, selectedId)=>{
    const cats = catsForDept(deptId);
    const opts = cats.map(c=>`<option value="${c.id}" ${selectedId===c.id?'selected':''}>${esc(c.name)}</option>`).join('');
    return opts + `<option value="__new__">+ Add new category…</option>`;
  };

  openModal(prod? 'Edit Product':'Add Product', `
    <div class="field">
      <label>Item type</label>
      <div class="radio-row">
        <label class="radio-opt ${!prod || !prod.nonInventory?'checked':''}"><input type="radio" name="m-itemtype" value="inventory" ${!prod || !prod.nonInventory?'checked':''}> Inventory Item</label>
        <label class="radio-opt ${prod && prod.nonInventory?'checked':''}"><input type="radio" name="m-itemtype" value="noninventory" ${prod && prod.nonInventory?'checked':''}> Non-Inventory Item / Service</label>
      </div>
      <div class="hint">Non-inventory items (e.g. delivery fee, labor, gift wrap) don't track stock — they can be sold any number of times and won't show up on low-stock alerts.</div>
    </div>
    <div class="field"><label>Product name</label><input id="m-name" value="${prod?esc(prod.name):''}" placeholder="e.g. Bottled Water 500ml"></div>
    <div class="field-row">
      <div class="field"><label id="m-barcode-label">Barcode</label><input id="m-barcode" value="${prod?esc(prod.barcode):''}" placeholder="e.g. 4800016641231" autocomplete="off"></div>
      <div class="field">
        <label>Department</label>
        <select id="m-dept">${buildDeptOptions(dept0)}</select>
        <div id="m-dept-new-wrap" style="display:none;margin-top:6px;">
          <div class="field-row">
            <input id="m-dept-new" placeholder="New department name" style="flex:1;">
            <button type="button" class="btn btn-primary btn-sm" id="m-dept-new-add">Add</button>
          </div>
        </div>
      </div>
    </div>
    <div class="field">
      <label>Category</label>
      <select id="m-cat">${buildCatOptions(dept0, prod? prod.categoryId : null)}</select>
      <div id="m-cat-new-wrap" style="display:none;margin-top:6px;">
        <div class="field-row">
          <input id="m-cat-new" placeholder="New category name" style="flex:1;">
          <button type="button" class="btn btn-primary btn-sm" id="m-cat-new-add">Add</button>
        </div>
      </div>
    </div>
    <div class="field-row">
      <div class="field"><label>Selling price (₱)</label><input id="m-price" type="number" min="0" step="0.01" value="${prod?prod.price:''}"></div>
      <div class="field"><label>Cost price (₱)</label><input id="m-cost" type="number" min="0" step="0.01" value="${prod?prod.cost:''}"></div>
    </div>
    <div class="field-row" id="m-stock-row" style="${prod && prod.nonInventory?'display:none;':''}">
      <div class="field"><label>Current stock</label><input id="m-stock" type="number" min="0" step="1" value="${prod?prod.stock:0}" ${prod?'disabled':''}></div>
      <div class="field"><label>Reorder level</label><input id="m-reorder" type="number" min="0" step="1" value="${prod?prod.reorderLevel:5}"></div>
    </div>
    ${prod && !prod.nonInventory? `<div class="hint">Use "Adjust" from the table to change stock levels (keeps an audit trail simple).</div>`:''}
  `, `<button class="btn btn-ghost" data-action="close-modal">Cancel</button>${!prod?`<button class="btn btn-ghost" id="m-save-another">Save &amp; Add Another</button>`:''}<button class="btn btn-primary" id="m-save">Save</button>`);

  const itemTypeRadios = document.querySelectorAll('input[name="m-itemtype"]');
  const stockRow = document.getElementById('m-stock-row');
  const barcodeLabel = document.getElementById('m-barcode-label');
  const barcodeInp = document.getElementById('m-barcode');
  const updateForItemType = ()=>{
    const isNonInv = document.querySelector('input[name="m-itemtype"]:checked')?.value === 'noninventory';
    stockRow.style.display = isNonInv ? 'none' : '';
    barcodeLabel.textContent = isNonInv ? 'Barcode (optional)' : 'Barcode';
    barcodeInp.placeholder = isNonInv ? 'Leave blank to auto-generate' : 'e.g. 4800016641231';
  };
  itemTypeRadios.forEach(r=>{
    r.addEventListener('change', ()=>{
      itemTypeRadios.forEach(x=> x.closest('.radio-opt').classList.toggle('checked', x.checked));
      updateForItemType();
    });
  });
  updateForItemType();

  const deptSel = document.getElementById('m-dept');
  const catSel = document.getElementById('m-cat');
  const deptNewWrap = document.getElementById('m-dept-new-wrap');
  const catNewWrap = document.getElementById('m-cat-new-wrap');
  const deptNewInp = document.getElementById('m-dept-new');
  const catNewInp = document.getElementById('m-cat-new');

  if(!state.departments.length){ deptNewWrap.style.display='block'; }
  if(catSel.value === '__new__'){ catNewWrap.style.display='block'; }

  deptSel.addEventListener('change', ()=>{
    if(deptSel.value === '__new__'){
      deptNewWrap.style.display='block';
      deptNewInp.focus();
    } else {
      deptNewWrap.style.display='none';
      catSel.innerHTML = buildCatOptions(deptSel.value, null);
      catNewWrap.style.display = catSel.value==='__new__' ? 'block' : 'none';
    }
  });

  document.getElementById('m-dept-new-add').addEventListener('click', ()=>{
    const name = deptNewInp.value.trim();
    if(!name){ toast('Enter a department name.','err'); return; }
    const newDept = {id:uid('dep'), name};
    state.departments.push(newDept);
    save();
    deptSel.innerHTML = buildDeptOptions(newDept.id);
    deptNewWrap.style.display='none';
    deptNewInp.value='';
    catSel.innerHTML = buildCatOptions(newDept.id, null);
    catNewWrap.style.display = catSel.value==='__new__' ? 'block' : 'none';
    toast('Department added.','ok');
  });

  catSel.addEventListener('change', ()=>{
    if(catSel.value === '__new__'){
      catNewWrap.style.display='block';
      catNewInp.focus();
    } else {
      catNewWrap.style.display='none';
    }
  });

  document.getElementById('m-cat-new-add').addEventListener('click', ()=>{
    const name = catNewInp.value.trim();
    const departmentId = deptSel.value;
    if(departmentId === '__new__' || !departmentId){ toast('Add the department first.','err'); return; }
    if(!name){ toast('Enter a category name.','err'); return; }
    const newCat = {id:uid('cat'), name, departmentId};
    state.categories.push(newCat);
    save();
    catSel.innerHTML = buildCatOptions(departmentId, newCat.id);
    catNewWrap.style.display='none';
    catNewInp.value='';
    toast('Category added.','ok');
  });

  const saveProduct = ()=>{
    const nonInventory = document.querySelector('input[name="m-itemtype"]:checked')?.value === 'noninventory';
    const name = document.getElementById('m-name').value.trim();
    let barcode = document.getElementById('m-barcode').value.trim();
    const departmentId = deptSel.value;
    const categoryId = catSel.value;
    const price = Number(document.getElementById('m-price').value)||0;
    const cost = Number(document.getElementById('m-cost').value)||0;
    const stock = nonInventory ? 0 : (Number(document.getElementById('m-stock').value)||0);
    const reorderLevel = nonInventory ? 0 : (Number(document.getElementById('m-reorder').value)||0);
    if(!name){ toast('Enter a name.','err'); return false; }
    if(!barcode){
      if(!nonInventory){ toast('Enter a barcode.','err'); return false; }
      barcode = 'SVC-' + Math.random().toString(36).slice(2,8).toUpperCase();
    }
    const dupe = state.products.find(p=>p.barcode===barcode && (!prod || p.id!==prod.id));
    if(dupe){ toast(`Barcode already used by "${dupe.name}".`,'err'); return false; }
    if(!departmentId || departmentId==='__new__'){ toast('Choose or finish adding a department.','err'); return false; }
    if(!categoryId || categoryId==='__new__'){ toast('Choose or finish adding a category.','err'); return false; }
    if(prod){ Object.assign(prod, {name,barcode,departmentId,categoryId,price,cost,reorderLevel,nonInventory}); }
    else{ state.products.push({id:uid('prd'), name, barcode, departmentId, categoryId, price, cost, stock, reorderLevel, nonInventory}); }
    save();
    return true;
  };

  document.getElementById('m-save').addEventListener('click', ()=>{
    if(!saveProduct()) return;
    closeModal(); renderView(); toast('Product saved.','ok');
  });

  const saveAnotherBtn = document.getElementById('m-save-another');
  if(saveAnotherBtn) saveAnotherBtn.addEventListener('click', ()=>{
    if(!saveProduct()) return;
    renderView();
    toast('Product saved. Add the next one.','ok');
    // Keep department/category selected (handy when adding a batch from the same
    // category) but clear the item-specific fields for the next entry.
    document.getElementById('m-name').value = '';
    document.getElementById('m-barcode').value = '';
    document.getElementById('m-price').value = '';
    document.getElementById('m-cost').value = '';
    document.getElementById('m-stock').value = 0;
    document.getElementById('m-reorder').value = 5;
    document.getElementById('m-name').focus();
  });
}

function openStockModal(id){
  const prod = getProd(id);
  openModal('Adjust Stock — ' + esc(prod.name), `
    <div class="hint" style="margin-bottom:10px;">Current stock: <strong>${prod.stock}</strong></div>
    <div class="field"><label>Adjustment type</label>
      <select id="m-type"><option value="add">Add stock (received)</option><option value="remove">Remove stock (damaged/lost)</option><option value="set">Set exact quantity</option></select>
    </div>
    <div class="field"><label>Quantity</label><input id="m-qty" type="number" min="0" step="1" value="0"></div>
  `, `<button class="btn btn-ghost" data-action="close-modal">Cancel</button><button class="btn btn-primary" id="m-save">Apply</button>`);
  document.getElementById('m-save').addEventListener('click', ()=>{
    const type = document.getElementById('m-type').value;
    const qty = Number(document.getElementById('m-qty').value)||0;
    if(type==='add') prod.stock += qty;
    else if(type==='remove') prod.stock = Math.max(0, prod.stock-qty);
    else prod.stock = Math.max(0, qty);
    save(); closeModal(); renderView(); toast('Stock updated.','ok');
  });
}

function viewCustomers(){
  const filter = state.ui.custFilter.toLowerCase();
  const list = state.customers.filter(c=> !filter || c.name.toLowerCase().includes(filter) || (c.phone||'').includes(filter) || (c.barcode||'').toLowerCase().includes(filter));
  const rs = state.meta.rewardsSettings || {enabled:false, amountPerPoint:100};
  const rows = list.length? list.map(c=>{
    const total = custSaleTotal(c.id), bal = custLayawayBalance(c.id);
    return `<tr>
      <td><strong>${esc(c.name)}</strong></td>
      <td class="mono">${esc(c.barcode||'—')}</td>
      <td>${esc(c.phone||'—')}</td>
      <td>${esc(c.email||'—')}</td>
      <td class="num">${fmt(total)}</td>
      <td class="num">${bal>0? `<span class="badge badge-amber">${fmt(bal)}</span>` : '—'}</td>
      <td class="num">${rs.enabled? `<strong>${c.points||0}</strong>` : '—'}</td>
      <td>
        <button class="icon-btn" data-action="view-customer" data-id="${c.id}">View</button>
        <button class="icon-btn" data-action="edit-customer" data-id="${c.id}">Edit</button>
        ${rs.enabled? `<button class="icon-btn" data-action="redeem-points" data-id="${c.id}">Redeem Points</button><button class="icon-btn" data-action="adjust-points" data-id="${c.id}">Adjust Points</button>`:''}
        <button class="icon-btn" data-action="delete-customer" data-id="${c.id}">Delete</button>
      </td>
    </tr>`;
  }).join('') : `<tr class="empty-row"><td colspan="8">No customers found.</td></tr>`;

  return `
  <div class="view-title"><h1>Customers</h1><div class="sub">${state.customers.length} on file</div></div>
  <div class="card card-pad" style="margin-bottom:16px;">
    <h3 style="margin-top:0;">Rewards program</h3>
    <div class="field">
      <label class="radio-opt" style="display:flex;width:100%;">
        <input type="checkbox" id="rw-enabled" style="width:auto;" ${rs.enabled?'checked':''}>
        <span style="margin-left:8px;">Enable rewards points for customer purchases</span>
      </label>
    </div>
    <div class="field-row">
      <div class="field">
        <label>Give 1 point for every ₱ spent</label>
        <input type="number" min="1" step="1" id="rw-rate" value="${rs.amountPerPoint||100}" ${!rs.enabled?'disabled':''}>
      </div>
      <div class="field">
        <label>Redeem: 1 point = ₱</label>
        <input type="number" min="0.01" step="0.01" id="rw-value" value="${rs.pointValue||1}" ${!rs.enabled?'disabled':''}>
      </div>
    </div>
    <button class="btn btn-primary" data-action="save-rewards-settings">Save Rewards Settings</button>
    <div class="hint" style="margin-top:8px;">Points are earned automatically whenever a sale (or lay-away order) is linked to a customer — based on the full order total, at the moment it's completed. Customers can then claim their points as cash, a store credit toward a purchase, phone load, or a GCash transfer.</div>
  </div>
  <div class="card card-pad" style="margin-bottom:16px;">
    <label>Scan customer barcode</label>
    <div style="display:flex;gap:8px;">
      <input type="text" id="cust-barcode-scan" placeholder="Scan a customer's barcode to jump straight to their profile" autocomplete="off" style="max-width:420px;">
    </div>
    <div class="hint">Press Enter after scanning (or typing) a barcode to open that customer's record directly.</div>
  </div>
  <div class="card">
    <div class="card-head">
      <h3>Directory</h3>
      <div style="display:flex;gap:8px;flex-wrap:wrap;">
        <div class="search-box"><input id="cust-search" placeholder="Search name, phone or barcode" value="${esc(state.ui.custFilter)}"></div>
        <button class="btn btn-ghost btn-sm" data-action="export-customers-pdf">Export PDF</button>
        <button class="btn btn-ghost btn-sm" data-action="export-customers-excel">Export Excel</button>
        <button class="btn btn-primary btn-sm" data-action="add-customer">+ Add Customer</button>
      </div>
    </div>
    <div class="tbl-wrap"><table>
      <thead><tr><th>Name</th><th>Barcode</th><th>Phone</th><th>Email</th><th>Lifetime Sales</th><th>Lay-away Balance</th><th>Points</th><th>Actions</th></tr></thead>
      <tbody>${rows}</tbody>
    </table></div>
  </div>`;
}

function bindCustomerEvents(){
  const search = document.getElementById('cust-search'); if(search) search.addEventListener('input', ()=>{ state.ui.custFilter = search.value; renderView(); });
  const addBtn = document.querySelector('[data-action="add-customer"]'); if(addBtn) addBtn.addEventListener('click', ()=>openCustomerModal());
  document.querySelectorAll('[data-action="edit-customer"]').forEach(b=>b.addEventListener('click',()=>openCustomerModal(b.dataset.id)));
  document.querySelectorAll('[data-action="view-customer"]').forEach(b=>b.addEventListener('click',()=>openCustomerDetail(b.dataset.id)));
  document.querySelectorAll('[data-action="delete-customer"]').forEach(b=>b.addEventListener('click',()=>{
    if(confirm('Delete this customer? Their past sales will show as "Walk-in".')){
      state.customers = state.customers.filter(c=>c.id!==b.dataset.id);
      save(); renderView(); toast('Customer deleted.','ok');
    }
  }));
  document.querySelectorAll('[data-action="adjust-points"]').forEach(b=>b.addEventListener('click',()=>openAdjustPointsModal(b.dataset.id)));
  document.querySelectorAll('[data-action="redeem-points"]').forEach(b=>b.addEventListener('click',()=>openRedeemPointsModal(b.dataset.id)));

  const rwEnabled = document.getElementById('rw-enabled');
  if(rwEnabled) rwEnabled.addEventListener('change', ()=>{
    const rateInp = document.getElementById('rw-rate');
    const valInp = document.getElementById('rw-value');
    if(rateInp) rateInp.disabled = !rwEnabled.checked;
    if(valInp) valInp.disabled = !rwEnabled.checked;
  });
  const saveRewardsBtn = document.querySelector('[data-action="save-rewards-settings"]');
  if(saveRewardsBtn) saveRewardsBtn.addEventListener('click', ()=>{
    const enabled = document.getElementById('rw-enabled').checked;
    const amountPerPoint = Number(document.getElementById('rw-rate').value)||100;
    const pointValue = Number(document.getElementById('rw-value').value)||1;
    if(amountPerPoint<=0){ toast('Enter an amount greater than 0.','err'); return; }
    if(pointValue<=0){ toast('Enter a redemption value greater than 0.','err'); return; }
    state.meta.rewardsSettings = { enabled, amountPerPoint, pointValue };
    save(); renderView(); toast('Rewards settings saved.','ok');
  });

  const exportPdfBtn = document.querySelector('[data-action="export-customers-pdf"]');
  if(exportPdfBtn) exportPdfBtn.addEventListener('click', exportCustomersPDF);
  const exportExcelBtn = document.querySelector('[data-action="export-customers-excel"]');
  if(exportExcelBtn) exportExcelBtn.addEventListener('click', exportCustomersExcel);

  const barcodeScan = document.getElementById('cust-barcode-scan');
  if(barcodeScan){
    barcodeScan.focus();
    barcodeScan.addEventListener('keydown', (e)=>{
      if(e.key!=='Enter') return;
      e.preventDefault();
      const code = barcodeScan.value.trim();
      if(!code) return;
      const cust = getCustByBarcode(code);
      if(!cust){ toast(`No customer found for barcode "${code}".`,'err'); barcodeScan.select(); return; }
      barcodeScan.value = '';
      openCustomerDetail(cust.id);
    });
  }
}

function openCustomerModal(id){
  const cust = id? getCust(id) : null;
  openModal(cust? 'Edit Customer':'Add Customer', `
    <div class="field"><label>Full name</label><input id="m-name" value="${cust?esc(cust.name):''}"></div>
    <div class="field-row">
      <div class="field"><label>Phone</label><input id="m-phone" value="${cust?esc(cust.phone):''}" placeholder="09xx xxx xxxx"></div>
      <div class="field"><label>Email</label><input id="m-email" value="${cust?esc(cust.email):''}"></div>
    </div>
    <div class="field">
      <label>Barcode / loyalty card #</label>
      <div style="display:flex;gap:8px;">
        <input id="m-barcode" value="${cust?esc(cust.barcode):''}" placeholder="e.g. CUST-100003" autocomplete="off" style="flex:1;">
        <button class="btn btn-ghost btn-sm" id="m-gen-barcode" type="button" style="white-space:nowrap;">Generate Barcode</button>
      </div>
      <div id="barcode-preview-wrap" style="margin-top:10px;${cust&&cust.barcode?'':'display:none;'}">
        <div style="background:#fff;border:1px solid var(--border);border-radius:8px;padding:10px;display:inline-block;">
          <canvas id="barcode-canvas"></canvas>
        </div>
        <div style="margin-top:6px;">
          <button class="btn btn-ghost btn-sm" id="m-download-barcode" type="button">Download Barcode</button>
        </div>
      </div>
    </div>
    <div class="field"><label>Address</label><input id="m-addr" value="${cust?esc(cust.address):''}"></div>
    <div class="field"><label>Notes</label><textarea id="m-notes" rows="2">${cust?esc(cust.notes):''}</textarea></div>
  `, `<button class="btn btn-ghost" data-action="close-modal">Cancel</button><button class="btn btn-primary" id="m-save">Save</button>`);

  const barcodeInput = document.getElementById('m-barcode');
  const previewWrap = document.getElementById('barcode-preview-wrap');

  function refreshBarcodePreview(){
    const val = barcodeInput.value.trim();
    if(!val){ previewWrap.style.display = 'none'; return; }
    try{
      JsBarcode('#barcode-canvas', val, { format:'CODE128', displayValue:true, width:2, height:60, margin:8, font:'monospace', fontSize:14 });
      previewWrap.style.display = 'block';
    }catch(e){ previewWrap.style.display = 'none'; }
  }
  refreshBarcodePreview();
  barcodeInput.addEventListener('input', refreshBarcodePreview);

  document.getElementById('m-gen-barcode').addEventListener('click', ()=>{
    let code;
    do{ code = 'CUST-' + Math.floor(100000 + Math.random()*900000); }
    while(state.customers.some(c=>c.barcode===code && (!cust || c.id!==cust.id)));
    barcodeInput.value = code;
    refreshBarcodePreview();
  });

  document.getElementById('m-download-barcode').addEventListener('click', ()=>{
    const val = barcodeInput.value.trim();
    if(!val){ toast('Generate or enter a barcode first.','err'); return; }
    const canvas = document.createElement('canvas');
    try{
      JsBarcode(canvas, val, { format:'CODE128', displayValue:true, width:2, height:80, margin:10, font:'monospace', fontSize:16 });
    }catch(e){ toast('Could not generate a barcode image for that value.','err'); return; }
    const a = document.createElement('a');
    a.href = canvas.toDataURL('image/png');
    a.download = `barcode-${val}.png`;
    a.click();
  });

  document.getElementById('m-save').addEventListener('click', ()=>{
    const name = document.getElementById('m-name').value.trim();
    if(!name){ toast('Enter a name.','err'); return; }
    const barcode = barcodeInput.value.trim();
    if(barcode){
      const dupe = state.customers.find(c=>c.barcode===barcode && (!cust || c.id!==cust.id));
      if(dupe){ toast(`Barcode already used by "${dupe.name}".`,'err'); return; }
    }
    const data = {
      name, phone: document.getElementById('m-phone').value.trim(),
      email: document.getElementById('m-email').value.trim(),
      barcode,
      address: document.getElementById('m-addr').value.trim(),
      notes: document.getElementById('m-notes').value.trim()
    };
    if(cust) Object.assign(cust, data); else state.customers.push({id:uid('cus'), ...data, createdAt:Date.now()});
    save(); closeModal(); renderView(); toast('Customer saved.','ok');
  });
}

function openAdjustPointsModal(id){
  const cust = getCust(id);
  if(!cust) return;
  openModal(`Adjust Points — ${esc(cust.name)}`, `
    <div class="hint" style="margin-bottom:12px;">Current balance: <strong>${cust.points||0} points</strong></div>
    <div class="field">
      <label>Adjustment type</label>
      <div class="radio-row">
        <label class="radio-opt checked"><input type="radio" name="pt-type" value="add" checked> Add points</label>
        <label class="radio-opt"><input type="radio" name="pt-type" value="deduct"> Deduct / redeem points</label>
      </div>
    </div>
    <div class="field"><label>Points</label><input type="number" min="1" step="1" id="pt-amount" placeholder="0"></div>
    <div class="field"><label>Reason</label><input type="text" id="pt-reason" placeholder="e.g. Redeemed for ₱50 discount, birthday bonus"></div>
  `, `<button class="btn btn-ghost" data-action="close-modal">Cancel</button><button class="btn btn-primary" id="pt-save">Save</button>`);

  document.querySelectorAll('input[name="pt-type"]').forEach(r=>{
    r.addEventListener('change', ()=>{
      document.querySelectorAll('input[name="pt-type"]').forEach(x=> x.closest('.radio-opt').classList.toggle('checked', x.checked));
    });
  });

  document.getElementById('pt-save').addEventListener('click', ()=>{
    const type = document.querySelector('input[name="pt-type"]:checked')?.value || 'add';
    const pts = Math.floor(Number(document.getElementById('pt-amount').value)||0);
    const reason = document.getElementById('pt-reason').value.trim();
    if(pts<=0){ toast('Enter a points amount greater than 0.','err'); return; }
    if(!reason){ toast('Enter a reason for this adjustment.','err'); return; }
    if(type==='deduct' && pts > (cust.points||0)){ toast(`Only ${cust.points||0} points available to deduct.`,'err'); return; }
    cust.points = (cust.points||0) + (type==='add'? pts : -pts);
    if(!state.rewardsLog) state.rewardsLog = [];
    state.rewardsLog.push({id:uid('rwd'), date:Date.now(), customerId:cust.id, customerName:cust.name, points: type==='add'? pts : -pts, type:'adjusted', note:reason});
    save(); closeModal(); renderView();
    toast(`Points ${type==='add'?'added':'deducted'}.`,'ok');
  });
}

function openRedeemPointsModal(id){
  const cust = getCust(id);
  if(!cust) return;
  const rs = state.meta.rewardsSettings || {};
  const pointValue = Number(rs.pointValue)||1;
  const maxValue = round2((cust.points||0) * pointValue);

  openModal(`Redeem Points — ${esc(cust.name)}`, `
    <div class="hint" style="margin-bottom:12px;">Balance: <strong>${cust.points||0} points</strong> &middot; worth up to <strong>${fmt(maxValue)}</strong> (1 point = ${fmt(pointValue)})</div>
    <div class="field">
      <label>How is the customer claiming this?</label>
      <div class="radio-row">
        <label class="radio-opt checked"><input type="radio" name="rd-method" value="cash" checked> Cash</label>
        <label class="radio-opt"><input type="radio" name="rd-method" value="product"> Product Purchase</label>
        <label class="radio-opt"><input type="radio" name="rd-method" value="load"> Load</label>
        <label class="radio-opt"><input type="radio" name="rd-method" value="gcash"> GCash</label>
      </div>
    </div>
    <div class="field">
      <label>Points to redeem</label>
      <input type="number" min="1" step="1" max="${cust.points||0}" id="rd-points" placeholder="0">
      <div class="hint">Value: <span id="rd-value-preview">${fmt(0)}</span></div>
    </div>
    <div id="rd-product-note" class="hint" style="display:none;background:var(--teal-tint);padding:10px 12px;border-radius:8px;color:var(--ink);">This will be saved as store credit on the customer's account. The next time they're attached to a cart in Store Sales, an "Apply reward credit" option will appear in the Payment window to use it toward that purchase.</div>
  `, `<button class="btn btn-ghost" data-action="close-modal">Cancel</button><button class="btn btn-primary" id="rd-confirm">Redeem</button>`);

  const pointsInp = document.getElementById('rd-points');
  const valuePreview = document.getElementById('rd-value-preview');
  const productNote = document.getElementById('rd-product-note');

  const refresh = ()=>{
    const pts = Math.max(0, Math.floor(Number(pointsInp.value)||0));
    valuePreview.textContent = fmt(round2(pts * pointValue));
    const method = document.querySelector('input[name="rd-method"]:checked')?.value;
    productNote.style.display = method==='product' ? 'block' : 'none';
  };
  pointsInp.addEventListener('input', refresh);
  document.querySelectorAll('input[name="rd-method"]').forEach(r=>{
    r.addEventListener('change', ()=>{
      document.querySelectorAll('input[name="rd-method"]').forEach(x=> x.closest('.radio-opt').classList.toggle('checked', x.checked));
      refresh();
    });
  });
  pointsInp.focus();

  document.getElementById('rd-confirm').addEventListener('click', ()=>{
    const pts = Math.floor(Number(pointsInp.value)||0);
    if(pts<=0){ toast('Enter a points amount greater than 0.','err'); return; }
    if(pts > (cust.points||0)){ toast(`Only ${cust.points||0} points available.`,'err'); return; }
    const method = document.querySelector('input[name="rd-method"]:checked')?.value || 'cash';
    const value = round2(pts * pointValue);

    requireAuth(`Redeem Points — ${cust.name}`, (user)=>{
      cust.points = (cust.points||0) - pts;
      if(!state.rewardsLog) state.rewardsLog = [];
      const methodLabel = method==='product'?'Product Purchase':method==='load'?'Load':method==='gcash'?'GCash':'Cash';
      state.rewardsLog.push({id:uid('rwd'), date:Date.now(), customerId:cust.id, customerName:cust.name, points:-pts, type:'redeemed', note:`Redeemed via ${methodLabel} (${fmt(value)})`});

      if(method==='product'){
        cust.pendingRedemptionCredit = round2((cust.pendingRedemptionCredit||0) + value);
      } else {
        const channel = method==='cash' ? 'store' : 'gcash'; // load & gcash both come out of GCash-related funds
        if(!state.cashAdjustments) state.cashAdjustments = [];
        state.cashAdjustments.push({
          id: uid('cadj'), type:'withdraw', channel, amount: value,
          reason: `Rewards redemption (${methodLabel}) — ${cust.name}`,
          date: Date.now(), dayLogId: state.session.dayOpen ? state.session.currentDayLogId : null,
          recordedByUserId: user.id, recordedByUserName: user.name
        });
      }

      save(); closeModal(); renderView();
      toast(`${pts} points redeemed (${fmt(value)}) via ${methodLabel}.`,'ok');
    });
  });
}

function customerExportRows(){
  return state.customers.map(c=>{
    const total = custSaleTotal(c.id), bal = custLayawayBalance(c.id);
    return {
      Name: c.name, Barcode: c.barcode||'', Phone: c.phone||'', Email: c.email||'',
